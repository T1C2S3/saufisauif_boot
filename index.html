<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Drink-Rad</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drink-Rad">
<meta name="theme-color" content="#0b1830">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0b1830}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen party app, wheel center stage, player strip above, sheets slide up from below. Single dark "ship deck at night" look by choice. */
:root {
  --night: #0b1830;
  --deck: #13254a;
  --deck-2: #1b3160;
  --line: #2b4377;
  --foam: #eef3ff;
  --mist: #a9b8d8;
  --coral: #ff6b57;
  --gold: #ffc94a;
  --sea: #2ec4b6;
  --violet: #8b7bff;
  --pink: #ff7eb6;
  --lime: #b5e655;
  --ink: #0b1830;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 0%, #1d3a72 0%, var(--night) 60%) fixed, var(--night);
  color: var(--foam);
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 24px;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.01em; margin: 0; line-height: 1; }
h1 span { color: var(--coral); }
.sub { color: var(--mist); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }

.roompill { appearance: none; border: 1.5px solid var(--line); background: var(--deck); color: var(--mist); border-radius: 99px; padding: 6px 12px; font: 700 .78rem var(--body); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.roompill.on { color: var(--foam); border-color: var(--sea); }
.roompill i { width: 8px; height: 8px; border-radius: 50%; background: var(--sea); flex: 0 0 auto; }
.roompill small { color: var(--mist); font-weight: 600; }
.roompill.wait i { background: var(--gold); }
.roompill.offline, .roompill.error { border-color: var(--line); }
.roompill.offline i, .roompill.error i { background: var(--mist); }
.roomcode { font: 800 2.6rem var(--display); letter-spacing: .14em; text-align: center; color: var(--gold); margin: 6px 0 2px; }

.ver { text-align: center; color: var(--mist); font-size: .72rem; opacity: .7; padding: 2px 0 6px; font-variant-numeric: tabular-nums; }

/* players */
.players { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.players::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--deck); color: var(--foam);
  border-radius: 999px; padding: 8px 14px; font: 600 .95rem var(--body); display: flex; gap: 8px; align-items: center;
}
.chip small { color: var(--mist); font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.chip.on small { color: #5a4200; }
.chip.add { color: var(--mist); border-style: dashed; }
.chip.guest { color: var(--gold); border-style: dashed; border-color: var(--gold); }
.tag.gast { background: var(--violet); color: #fff; }
#modeSw { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }
.bgline { appearance: none; width: 100%; display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; color: var(--mist); font: 600 .8rem var(--body); text-align: left; }
.bgline .bgsc { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.bgline.win { color: var(--gold); border-color: var(--gold); }
.bgmini { background: var(--deck); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 8px; }
.bgmini .bghead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bggrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.bggrid div { border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 4px; min-height: 46px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: .72rem; font-weight: 700; line-height: 1.15; color: var(--foam); overflow-wrap: anywhere; }
.bggrid div.hit { background: var(--sea); color: var(--ink); border-color: var(--sea); }
.bggrid div.hit::before { content: "✓ "; }
.bggrid div.now { outline: 3px solid var(--gold); outline-offset: 1px; }
.bggrid div.line { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.bgbig { font: 800 2.6rem/1 var(--display); color: var(--gold); text-align: center; margin: 6px 0; letter-spacing: .04em; }
.bgcard { margin: 10px 0 14px; }
.prize { background: var(--deck); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 10px 0 14px; display: grid; gap: 8px; }
.prize h3 { margin: 0; }
.prize .pdrink { font: 800 1.35rem/1.15 var(--display); }
.prize .row { padding: 6px 0; }
.prize .pavg { font: 800 2.2rem/1 var(--display); text-align: center; }
.prize .pavg.bad { color: var(--coral); } .prize .pavg.good { color: var(--sea); }
.prize .ok { color: var(--sea); font-weight: 700; }
.bggrid small { display: block; font-size: .62rem; font-weight: 600; opacity: .75; margin-top: 2px; }
.bgcard h3 { margin: 0 0 6px; font: 800 1rem var(--display); }

/* wheel */
.stage { position: relative; display: grid; place-items: center; padding-top: 14px; }
.wheel-wrap { position: relative; width: min(88vw, 400px); aspect-ratio: 1; max-width: 100%; }
#wheel { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 6px var(--deck-2), 0 0 0 9px var(--gold), 0 20px 50px rgba(0,0,0,.5); touch-action: manipulation; }
.lsearch { width: 100%; margin: 6px 0 4px; position: sticky; top: 0; z-index: 3; -webkit-appearance: none; appearance: none; font-size: 16px !important; }
.pointer {
  position: absolute; left: 50%; top: -18px; transform: translateX(-50%); width: 34px; height: 44px; z-index: 2;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.4));
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
}
.hub {
  position: absolute; inset: 0; margin: auto; width: 23%; height: 23%; border-radius: 50%;
  background: var(--night); border: 4px solid var(--gold); display: grid; place-items: center;
  font: 800 1rem var(--display); color: var(--gold); letter-spacing: .02em; pointer-events: none;
}
.turn { text-align: center; display: grid; gap: 4px; }
.turn b { font-family: var(--display); font-size: 1.35rem; font-weight: 800; }
.turn .left { color: var(--mist); font-size: .9rem; font-variant-numeric: tabular-nums; }
.spin {
  appearance: none; border: 0; border-radius: 18px; padding: 18px; width: 100%;
  background: var(--coral); color: #fff; font: 800 1.35rem var(--display); letter-spacing: .02em;
  box-shadow: 0 6px 0 #b8402f; transition: transform .08s, box-shadow .08s;
}
.spin:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8402f; }
.spin:disabled { opacity: .55; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tool { font-size: .78rem !important; }
.tool.mine { grid-column: 1 / -1; display: flex; align-items: center; flex-direction: row; justify-content: center; gap: 8px; font-size: .9rem !important; }
.mysum { display: flex; gap: 8px; margin: 4px 0 2px; }
.mysum div { flex: 1; background: var(--night); border-radius: 12px; padding: 8px; text-align: center; }
.mysum b { display: block; font: 800 1.3rem var(--display); color: var(--gold); }
.mysum span { font-size: .72rem; color: var(--mist); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
.kpi { background: var(--night); border-radius: 14px; padding: 10px; text-align: center; }
.kpi b { display: block; font: 800 1.5rem var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.kpi span { font-size: .75rem; color: var(--mist); }
.bar { height: 10px; border-radius: 99px; background: var(--night); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--coral); border-radius: 99px; }
.medal { font: 800 1.1rem var(--display); width: 28px; color: var(--gold); font-variant-numeric: tabular-nums; }
.hours { display: flex; align-items: flex-end; gap: 4px; height: 110px; padding-top: 18px; overflow-x: auto; }
.hours div { flex: 1 0 22px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: .7rem; color: var(--mist); font-variant-numeric: tabular-nums; }
.hours i { display: block; width: 100%; background: var(--sea); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.hours em { font-style: normal; color: var(--foam); font-weight: 700; }
.mode { display: grid; grid-template-columns: 1fr 1fr; background: var(--deck); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.mode button { appearance: none; border: 0; border-radius: 10px; padding: 9px; font: 700 .95rem var(--body); background: transparent; color: var(--mist); }
.mode.three { grid-template-columns: 1fr 1fr 1fr; }
.wahlrow select { width: 100%; appearance: none; border: 1.5px solid var(--line); background: var(--night); color: var(--foam); border-radius: 12px; padding: 11px 12px; font: 600 1rem var(--body); }
.wahlrow { display: grid; gap: 4px; padding: 8px 0; }
.ver { cursor: pointer; }
.fav { appearance: none; border: 0; background: none; font-size: 1.5rem; line-height: 1; color: var(--mist); padding: 2px 4px; }
.fav.on { color: var(--coral); }
.lockbox { display: grid; gap: 8px; background: var(--night); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
.switch input:disabled + span, [data-ex]:disabled { opacity: .45; }
#demoBar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 80; appearance: none; border: 0; border-radius: 99px; padding: 7px 14px; background: #c0182c; color: #fff; font: 800 .78rem var(--body); letter-spacing: .04em; box-shadow: 0 4px 14px rgba(0,0,0,.4); white-space: nowrap; }
body.demo .app { outline: 3px dashed #c0182c; outline-offset: 4px; border-radius: 12px; }
#dq .dqwrap { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(5,10,25,.6); padding: 24px; animation: dqfade .2s; }
#dq .dqcard { background: #fff; color: #c0182c; border: 6px solid #c0182c; border-radius: 18px; padding: 20px 22px; text-align: center; max-width: 340px; transform: rotate(-6deg); box-shadow: 0 12px 40px rgba(0,0,0,.5); animation: dqstamp .35s cubic-bezier(.2,1.6,.4,1); }
#dq .dqbig { font: 800 2.1rem var(--display); letter-spacing: .04em; line-height: 1; }
#dq .dqtxt { color: #0b1830; font-size: 1rem; margin: 10px 0 4px; }
#dq .dqsmall { color: #6b7894; font-size: .8rem; margin-top: 10px; }
@keyframes dqstamp { from { transform: rotate(-6deg) scale(2.4); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
@keyframes dqfade { from { opacity: 0; } }
.qrbox { background: #fff; border-radius: 14px; padding: 8px; margin: 12px auto 4px; width: min(100%, 340px); aspect-ratio: 1; }
.qrbox svg { width: 100%; height: 100%; display: block; }
.qrvid { width: 100%; border-radius: 14px; margin-top: 12px; background: #000; aspect-ratio: 3 / 4; object-fit: cover; }
.delh { padding: 6px 9px !important; font-size: .78rem !important; }
.delh.sure { background: var(--coral); color: #fff; }
.mode button.on { background: var(--sea); color: var(--ink); }
.orow { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cnt { font: 800 2rem var(--display); color: var(--gold); min-width: 52px; font-variant-numeric: tabular-nums; }
.oname { font: 800 1.35rem/1.15 var(--display); }
.stars { display: inline-flex; gap: 2px; flex: 0 0 auto; }
.stars button { appearance: none; border: 0; background: none; padding: 2px; font-size: 1.5rem; line-height: 1; color: var(--line); }
.stars button.on { color: var(--gold); }
.ratecard { background: var(--deck); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ratecard .grow { min-width: 0; flex: 1 1 140px; }
.ratecard .stars button { font-size: 1.9rem; }
.tool {
  appearance: none; border: 1.5px solid var(--line); background: var(--deck); color: var(--foam);
  border-radius: 14px; padding: 10px 4px; font: 600 .85rem var(--body); display: grid; gap: 4px; justify-items: center;
}
.tool svg { width: 22px; height: 22px; stroke: var(--gold); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }

/* overlays */
.scrim { position: fixed; inset: 0; background: rgba(5,10,25,.7); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; background: var(--deck);
  border-radius: 22px 22px 0 0; border-top: 3px solid var(--gold);
  padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  animation: up .25s ease-out; -webkit-user-select: text; user-select: text;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet h2 { font: 800 1.4rem var(--display); margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
.x { appearance: none; border: 0; background: var(--deck-2); color: var(--foam); width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; }
.row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.muted { color: var(--mist); font-size: .85rem; }
input[type=text], input[type=password], input[type=search] {
  width: 100%; font: 600 1rem var(--body); color: var(--foam); background: var(--night);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px;
}
.btn { appearance: none; border: 0; border-radius: 12px; padding: 11px 14px; font: 700 .95rem var(--body); background: var(--deck-2); color: var(--foam); }
.btn.pri { background: var(--gold); color: var(--ink); }
.btn.warn { background: transparent; border: 1.5px solid var(--coral); color: var(--coral); }
.btn.small { padding: 7px 10px; font-size: .85rem; }
.switch { position: relative; width: 50px; height: 30px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .2s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + span { background: var(--sea); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--sea); outline-offset: 2px; }
.cathead { font: 800 1.05rem var(--display); margin: 18px 0 2px; color: var(--gold); }
.drinkline { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.drinkline input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--sea); flex: 0 0 auto; }
.drinkline .grow { flex: 1; min-width: 0; }
.cnt1 { flex: 0 0 auto; font: 800 .95rem var(--display); color: var(--gold); margin-top: 2px; }
.ctr { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; }
.ctr .btn { padding: 4px 11px !important; font-size: 1.05rem !important; }
.ctr b { min-width: 2.2em; text-align: center; color: var(--gold); }
.drinkline.off .name { text-decoration: line-through; color: var(--mist); }
.name { font-weight: 700; }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
.tag.price { background: var(--coral); color: #fff; }
.tag.af { background: var(--sea); color: var(--ink); }
.tag.guess { background: var(--violet); color: #fff; }
.tag.done { background: var(--deck-2); color: var(--mist); }

/* result */
.result { text-align: center; padding-top: 8px; }
.result .who { color: var(--mist); text-transform: uppercase; letter-spacing: .1em; font-size: .8rem; font-weight: 700; }
.result .drink { font: 800 2.2rem/1.05 var(--display); margin: 10px 0 8px; text-wrap: balance; color: var(--gold); }
.result .ing { font-size: 1.05rem; line-height: 1.45; color: var(--foam); max-width: 34ch; margin: 0 auto; }
.result .meta { margin: 12px 0 18px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.result .meta .tag { margin: 0; font-size: .8rem; padding: 4px 10px; }
.tag.cat { background: var(--deck-2); color: var(--foam); }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.actions.three { grid-template-columns: 1fr 1fr 1.4fr; }
.actions.three .btn { padding-left: 8px; padding-right: 8px; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--sea); color: var(--ink); font-weight: 700; padding: 12px 18px; border-radius: 14px; z-index: 40;
  max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>Drink<span>·</span>Rad</h1>
    <button class="roompill" id="roomBtn" type="button">Gemeinsam spielen</button>
  </header>

  <div class="players" id="players"></div>

  <div class="stage">
    <div class="wheel-wrap">
      <svg class="pointer" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 44 L2 10 A16 16 0 0 1 32 10 Z" fill="#ffc94a" stroke="#0b1830" stroke-width="2"/><circle cx="17" cy="14" r="5" fill="#0b1830"/></svg>
      <canvas id="wheel" aria-label="Glücksrad mit Drinks"></canvas>
      <div class="hub">PROST</div>
    </div>
  </div>

  <div class="turn" aria-live="polite">
    <b id="turnName">–</b>
    <span class="left" id="turnLeft"></span>
  </div>
  <div id="rateCard"></div>
  <div id="bingoMini"></div>

  <div class="mode" id="modeSw" role="group" aria-label="Spielmodus"><button type="button" data-mode="single">Einzeln</button><button type="button" data-mode="round">Runde (alle)</button><button type="button" data-mode="wahl" hidden>Wahlrunde</button></div>
  <button class="spin" id="spinBtn" type="button">Drehen!</button>

  <div class="tools">
    <button class="tool mine" type="button" data-open="mine"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>Meine Drinks &amp; Bewertungen</button>
    <button class="tool" type="button" data-open="players"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c2 .6 3.2 2.4 3.5 5.2"/></svg>Spieler</button>
    <button class="tool" type="button" data-open="filter"><svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>Filter</button>
    <button class="tool" type="button" data-open="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Verlauf</button>

const BY_ID = Object.fromEntries(DRINKS.map(d => [d.id, d]));

// ---------- Zustand ----------
const APP_VERSION = "34"; // bei jedem Update hochzählen (gleich wie VERSION in sw.js)
const KEY = "drinkrad-flow-v1";
let DEMO = false, REAL = null; // Demo-Modus: Änderungen landen nirgends (kein Speichern, kein Raum-Abgleich)
const NAMES = ["Christoph","Mark","Tim","Julian"];
const DEFAULT = () => ({
  players: NAMES.map((n, i) => ({ id: "p" + i + Date.now().toString(36), name: n, seen: [], fav: [] })),
  cur: 0,
  cats: Object.fromEntries(Object.keys(CATS).map(k => [k, true])),
  inclOnly: true,
  allowAf: false,
  v: 2,
  excluded: [],
  history: [],
  ck: { inclOnly: false, allowAf: true, cats: Object.fromEntries(Object.keys(CATS).map(k => [k, true])) }, // Filter fürs Abhaken
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || DEFAULT(); } catch (e) { S = DEFAULT(); }
S = Object.assign(DEFAULT(), S);
S.players.forEach(p => { if (!Array.isArray(p.fav)) p.fav = []; });
for (const k of Object.keys(CATS)) { if (!(k in S.cats)) S.cats[k] = true; if (!(k in S.ck.cats)) S.ck.cats[k] = true; }
if (S.players.length && S.players.every(p => /^Spieler \d+$/.test(p.name))) {
  S.players = DEFAULT().players; S.history = []; S.cur = 0;
}
if (!("bingo" in S)) S.bingo = null;
if (S.mode === "bingo") S.mode = "round"; // Bingo läuft jetzt im Hintergrund mit
if (!S.gone || typeof S.gone !== "object") S.gone = {}; // entfernte Spieler (id -> Zeit), damit sie beim Abgleich nicht zurückkommen
if (S.v !== 2) { S.inclOnly = true; S.allowAf = false; S.v = 2; }
const save = () => { if (DEMO) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} syncSoon(); };

const enabled = () => DRINKS.filter(d =>
  S.cats[d.cat] && (!S.inclOnly || !d.price) && (S.allowAf || !d.af) && !S.excluded.includes(d.id));
const checkEnabled = () => DRINKS.filter(d =>
  S.ck.cats[d.cat] && (!S.ck.inclOnly || !d.price) && (S.ck.allowAf || !d.af));
const player = () => S.players[S.cur] || null;
const poolFor = p => { const en = enabled(); return en.filter(d => !p.seen.includes(d.id)); };

// ---------- Rad ----------
const cv = document.getElementById("wheel");
const ctx = cv.getContext("2d");
const COLORS = ["#ff6b57","#ffc94a","#2ec4b6","#8b7bff","#ff7eb6","#b5e655"];
const TEXT_ON = { "#ff6b57":"#fff", "#ffc94a":"#0b1830", "#2ec4b6":"#0b1830", "#8b7bff":"#fff", "#ff7eb6":"#0b1830", "#b5e655":"#0b1830" };
const MAX_SEG = 12;
let segs = [];      // drinks currently shown on the wheel
let rot = 0;        // radians
let spinning = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function refillSegs() {
  const p = player();
  const pool = p ? poolFor(p) : enabled();
  segs = shuffle(pool.slice()).slice(0, MAX_SEG);
}

    ctx.fillText("Keine Drinks im Filter", R, R * 0.55);

  for (let i = 0; i < n; i++) {
    const s = -Math.PI / 2 + i * a;
    const col = segColor(i, n);

    const maxChars = n <= 6 ? 20 : 17;
    ctx.fillText(short(segs[i].name, maxChars), R * 0.93, 0);
    ctx.restore();
  }

}

function prepPool(p) {
  let pool = poolFor(p);
  const en = enabled();
  if (!en.length) return null;
  if (!pool.length) {
    const enIds = new Set(en.map(d => d.id));
    p.seen = p.seen.filter(id => !enIds.has(id));
    save();
    toast(`${p.name} hat alles durch! Alle Drinks wieder drin.`);
    pool = poolFor(p);

}

function spinFor(p, dur, rid, fixed, bg, ext) {
  return new Promise(resolve => {
    const pool = fixed || prepPool(p);
    if (!pool) { resolve(null); return; }
    const winner = rigTake(p, fixed) || (!fixed && bingoBoost(p, pool)) || pool[Math.floor(Math.random() * pool.length)];
    if (!segs.some(d => d.id === winner.id) || segs.length === 0) refillSegsWith(winner, pool);
    const w = segs.findIndex(d => d.id === winner.id);
    const n = segs.length, a = Math.PI * 2 / n;
    const jitter = (Math.random() - 0.5) * a * 0.6;
    const target = -(w + 0.5) * a - jitter;
    const TAU = Math.PI * 2;
    const m = Math.ceil((rot + TAU * (dur > 3000 ? 5 : 3) - target) / TAU);
    const end = target + TAU * m;
    const start = rot;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) dur = 600;
    const t0 = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 4);
    (function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      rot = start + (end - start) * ease(t);
      draw();
      if (t < 1) requestAnimationFrame(frame);
      else {
        rot = end % TAU;
        if (p.guest) { resolve(winner); return; } // Gasttrinker: kein Haken, kein Verlauf, keine Statistik
        if (!p.seen.includes(winner.id)) p.seen.push(winner.id);
        const h = { pid: p.id, id: winner.id, t: Date.now() };
        if (rid) h.rid = rid;
        if (bg) h.bg = bg;
        if (ext) Object.assign(h, ext);

        resolve(winner);

}

// ---------- Drink-Bingo im Hintergrund, in nummerierten Bingo-Runden ----------
// Jeder hat eine 3x3-Karte mit 9 einzelnen Drinks aus dem Rad (laut Filter). Jeder Drink, den ein Spieler in der
// laufenden Bingo-Runde getrunken hat (gedreht, Wahlrunde oder abgehakt), hakt das Feld ab, wenn er auf seiner Karte steht.
// Runde 1 umfasst den ganzen bisherigen Verlauf (start 0) und ist auf allen Handys gleich (feste ID, feste Karten).
// Eine Bingo-Runde kann über Tage gehen; eine neue startet nur per Knopf mit Code und zweiter Bestätigung.
// Wer eine Reihe hat, gewinnt; danach ist die Runde eingefroren (won), bis jemand bewusst eine neue startet.
// S.bingo = { id, v: 4, n (Rundennummer), start, won, pool: "drink|…" (Rad beim Start), cards: { pid: "9 Drinks" }, prize }
// Optionaler Bonus beim Drehen (BG_BOOST) ist aus.
const BG_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const BG_BOOST = 0; // Christoph 27.11.: ohne Bonus, das Rad dreht rein zufällig
const bingoOn = () => !!(S.bingo && S.bingo.id && S.bingo.pool && S.bingo.v === 4);

}
function makeCard(p) {

}

}

// ---------- Bingo-Prämie: Sieger wählt einen Cocktail, die anderen bewerten ihn ehrlich ----------
// Ø über 3 oder genau 3: nichts passiert. Ø unter 3: Straf-Dreh nur für den Sieger, aus allen Drinks im Filter,
// die im Schnitt unter 3 Sternen liegen (alle Bewertungen aus dem Verlauf plus die Prämien-Bewertung).
// S.bingo.prize = { siegerId: { d: drinkId, r: { bewerterId: 1..5 } } }; der Straf-Drink steht im Verlauf mit h.bp = Bingo-ID.
const PRIZE_CATS = ["classic", "best", "sprizz", "long", "th", "chb"];
const f1de = x => x.toFixed(1).replace(".", ",");
const prizeOf = w => (S.bingo && S.bingo.prize && S.bingo.prize[w.id]) || null;
const prizeRaters = w => S.players.filter(p => p.id !== w.id);
function prizeAvg(w) {
  const pr = prizeOf(w); if (!pr || !pr.d) return null;
  const rs = prizeRaters(w).map(p => (pr.r || {})[p.id]).filter(Boolean);
  return { n: rs.length, of: prizeRaters(w).length, a: rs.length ? rs.reduce((s, x) => s + x, 0) / rs.length : 0 };
}
const prizeAllRated = w => { const x = prizeAvg(w); return !!x && x.n >= x.of; };
const prizeBad = w => prizeAllRated(w) && prizeAvg(w).n > 0 && prizeAvg(w).a < 3;
const penaltyEntry = w => S.history.find(h => bingoOn() && h.bp === S.bingo.id && h.pid === w.id);
const prizeOpen = w => !prizeAllRated(w) || (prizeBad(w) && !penaltyEntry(w));
const prizePending = () => bingoOn() && bingoWinners().some(prizeOpen);
function badPool(w) {
  const by = {};
  S.history.forEach(h => { if (h.r && BY_ID[h.id]) (by[h.id] = by[h.id] || []).push(h.r); });
  const pr = prizeOf(w);
  if (pr && pr.d) Object.values(pr.r || {}).forEach(r => (by[pr.d] = by[pr.d] || []).push(r));
  const en = new Set(enabled().map(d => d.id));
  const ids = Object.entries(by).filter(([id, rs]) => en.has(id) && rs.reduce((s, x) => s + x, 0) / rs.length < 3).map(([id]) => id);
  if (!ids.length && pr && BY_ID[pr.d]) ids.push(pr.d); // Notfall: dann eben nochmal der Prämien-Cocktail
  return ids.map(id => BY_ID[id]).filter(Boolean);
}
function prizeHTML(w) {
  const pr = prizeOf(w), raters = prizeRaters(w);
  if (!pr || !BY_ID[pr.d]) {
    const en = enabled(), mix = en.filter(d => PRIZE_CATS.includes(d.cat)), list = mix.length ? mix : en;
    const groups = Object.keys(CATS).map(c => [c, list.filter(d => d.cat === c)]).filter(([, ds]) => ds.length);
    return `<div class="prize"><h3>🏆 ${esc(w.name)} sucht einen Cocktail aus</h3>
      <label class="wahlrow"><select data-ppick="${esc(w.id)}"><option value="">– Cocktail wählen –</option>${groups.map(([c, ds]) => `<optgroup label="${esc(CATS[c])}">${ds.map(d => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join("")}</optgroup>`).join("")}</select></label></div>`;
  }
  const d = BY_ID[pr.d], x = prizeAvg(w), all = prizeAllRated(w);
  let body = "";
  if (!raters.length) body = `<p class="muted">Keiner da zum Bewerten, also passiert nichts.</p>`;
  else if (!all) {
    body = `<p class="muted">Die anderen probieren und bewerten ehrlich. Die Sterne bleiben geheim, bis alle abgegeben haben (${x.n} von ${x.of}).</p>` +
      raters.map(p => { const v = (pr.r || {})[p.id];
        return `<div class="row"><div class="grow"><b>${esc(p.name)}</b></div>${v
          ? `<span class="ok">✓ abgegeben</span> <button class="btn small" type="button" data-prre="${esc(w.id)}:${esc(p.id)}">ändern</button>`
          : `<span class="stars">${[1,2,3,4,5].map(n => `<button type="button" data-prate="${esc(w.id)}:${esc(p.id)}:${n}" aria-label="${n} Sterne">★</button>`).join("")}</span>`}</div>`; }).join("");
  } else {
    const bad = x.a < 3, pe = penaltyEntry(w);
    body = raters.map(p => `<div class="row"><div class="grow"><b>${esc(p.name)}</b></div><span class="stars">${[1,2,3,4,5].map(n => `<button type="button" class="${pr.r[p.id] >= n ? "on" : ""}" tabindex="-1" disabled>★</button>`).join("")}</span></div>`).join("") +
      `<div class="pavg ${bad ? "bad" : "good"}">Ø ${f1de(x.a)} ★</div>` +
      (!bad ? `<p style="text-align:center"><b class="ok">Gute Wahl!</b> Ø ist 3 oder mehr, es passiert nichts.</p>`
        : pe && BY_ID[pe.id] ? `<p style="text-align:center"><b style="color:var(--coral)">Straf-Drink für ${esc(w.name)}:</b> ${esc(BY_ID[pe.id].name)}</p>`
        : (() => { const pool = badPool(w);
            return `<p style="text-align:center"><b style="color:var(--coral)">Durchgefallen!</b> Ø unter 3: ${esc(w.name)} muss drehen und trinkt den Drink allein.</p>
              <p class="muted">Im Straf-Rad (${pool.length}): ${esc(pool.map(d => d.name).join(", "))}</p>
              <div class="actions" style="grid-template-columns:1fr"><button class="btn pri" type="button" data-ppen="${esc(w.id)}">Straf-Dreh für ${esc(w.name)}</button></div>`; })());
  }
  return `<div class="prize"><h3>🏆 ${esc(w.name)} hat gewählt</h3><div class="pdrink">${esc(d.name)}</div><div class="muted">${esc(d.ing)}</div>
    ${x.n === 0 ? `<div><button class="btn small" type="button" data-pchg="${esc(w.id)}">Anderen Cocktail wählen</button></div>` : ""}${body}</div>`;
}
function openPrize() {
  const w = bingoOn() ? bingoWinners() : [];
  if (!w.length) { openBingo(); return; }
  const sh = overlay.querySelector("#prizeBox") && overlay.querySelector(".sheet"), y = sh ? sh.scrollTop : 0;
  sheet("Bingo-Prämie", `<div id="prizeBox"><p class="muted">Wer Bingo hat, sucht einen Cocktail aus, die anderen bewerten ihn ehrlich. Ø über 3 oder genau 3: nichts passiert. Ø unter 3: Straf-Dreh nur aus Drinks mit Ø unter 3 Sternen, und den Drink bekommt nur der Bingo-Sieger.</p>

  box.querySelectorAll("[data-ppick]").forEach(sel => sel.onchange = () => { if (sel.value) { setPrize(sel.dataset.ppick, { d: sel.value, r: {} }); toast("Cocktail gewählt. Jetzt bewerten die anderen."); } });

  box.querySelectorAll("[data-ppen]").forEach(b => b.onclick = () => { const q = getW(b.dataset.ppen); if (q) { overlay.innerHTML = ""; spinPenalty(q); } });
  if ($("#prNew")) $("#prNew").onclick = () => restartBingo($("#prNew"));
}
async function spinPenalty(w) {
  if (spinning || !bingoOn() || penaltyEntry(w)) return;

  const i = S.players.indexOf(w); if (i >= 0) S.cur = i;

  const h = lastSpinEntry;

function refillSegsWith(winner, pool) {

// ---------- Suche in Listen ----------
// Filtert die Einträge direkt im Fenster (Name, Zutaten, Kategorie). Der Suchtext bleibt pro Liste stehen, bis das Fenster zugeht.
const SQ = {};
const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const searchBox = (key, ph) => `<input type="search" class="lsearch" id="lsearch" data-sk="${key}" placeholder="${esc(ph || "Drink suchen …")}" value="${esc(SQ[key] || "")}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">`;
function applySearch() {
  const inp = overlay.querySelector("#lsearch"); if (!inp) return;
  const q = norm(inp.value.trim()), words = q.split(/\s+/).filter(Boolean);
  const box = overlay.querySelector(".sheet"); if (!box) return;
  let any = 0, total = 0;
  box.querySelectorAll(".drinkline, .srow").forEach(el => {
    total++;
    const ok = !words.length || words.every(w => norm(el.dataset.q || el.textContent).includes(w));
    el.hidden = !ok; if (ok) any++;
  });
  // Überschriften ohne Treffer ausblenden
  let head = null, has = 0, vis = 0;
  const flush = () => { if (head && has) head.hidden = !vis; };
  [...box.children].forEach(el => {
    if (el.classList.contains("cathead")) { flush(); head = el; has = 0; vis = 0; }
    else if (el.matches(".drinkline, .srow")) { has++; if (!el.hidden) vis++; }
  });
  flush();
  let none = box.querySelector("#lsNone");
  if (words.length && total && !any) { if (!none) inp.insertAdjacentHTML("afterend", `<p class="muted" id="lsNone">Nichts gefunden.</p>`); }
  else if (none) none.remove();
}
function bindSearch() {
  const inp = overlay.querySelector("#lsearch"); if (!inp) return;
  inp.addEventListener("input", () => { SQ[inp.dataset.sk] = inp.value; applySearch(); });
  inp.addEventListener("click", e => e.stopPropagation());
  applySearch();
}
function openSheet(which) {
  if (spinning) return;
  if (which === "players") {
    sheet("Spieler", `
      <div id="plist">${S.players.map((p, i) => `
        <div class="row">
          <div class="grow"><input type="text" id="pn-${esc(p.id)}" value="${esc(p.name)}" data-rename="${i}" aria-label="Name von Spieler ${i + 1}"></div>
          <span class="muted" style="font-variant-numeric:tabular-nums">${p.seen.length}🍹</span>
          <button class="btn small warn" type="button" data-del="${i}">Entfernen</button>
        </div>`).join("")}</div>
      <form class="row" id="addForm">
        <div class="grow"><input type="text" id="newName" placeholder="Neuer Name" autocomplete="off" enterkeyhint="done"></div>
        <button class="btn pri" type="submit">Hinzufügen</button>
      </form>
      <p class="muted">Entfernen (Code nötig) löscht den Spieler samt seinen Drinks auf allen Handys im Raum und beim QR-Abgleich.</p>
      <p class="muted">Tipp: Antippen eines Namens oben wählt, wer dreht. Der gewählte Spieler bleibt, bis ihr oben jemand anderen antippt.</p>
      <div class="row"><div class="grow"><b>Alle Drinks zurücksetzen</b><div class="muted">Spieler bleiben, alle getrunkenen Drinks und der Verlauf werden gelöscht.</div></div>
        <button class="btn small warn" type="button" id="resetAll">Zurücksetzen</button></div>
      <div id="confirmBox"></div>`);
    overlay.querySelectorAll("[data-rename]").forEach(inp => inp.addEventListener("input", () => {
      const p = S.players[+inp.dataset.rename]; p.name = inp.value.trim() || p.name; save(); renderTop();
    }));
    overlay.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
      const p = S.players[+b.dataset.del]; if (!p) return;
      askCode(b.closest(".row"), () => { removePlayer(p.id); renderTop(); openSheet("players"); toast(`${p.name} entfernt.`); });
    }));
    $("#addForm").addEventListener("submit", e => {
      e.preventDefault(); const n = $("#newName").value.trim(); if (!n) return;
      S.players.push({ id: "p" + Date.now().toString(36), name: n, seen: [], fav: [] }); save(); renderTop(); openSheet("players");
      setTimeout(() => { const x = $("#newName"); x && x.focus(); }, 50);
    });
    $("#resetAll").addEventListener("click", () => {
      $("#confirmBox").innerHTML = `<div class="row"><div class="grow"><b>Wirklich alles zurücksetzen?</b></div><button class="btn small" type="button" id="noReset">Abbrechen</button><button class="btn small pri" type="button" id="yesReset">Ja</button></div>`;
      $("#noReset").onclick = () => $("#confirmBox").innerHTML = "";
      $("#yesReset").onclick = () => { S.players.forEach(p => p.seen = []); S.history = []; S.cur = 0; save(); toast("Alles zurückgesetzt."); closeSheet(); };
    });
  }
  if (which === "filter") {
    const counts = {}; DRINKS.forEach(d => counts[d.cat] = (counts[d.cat] || 0) + 1);
    const sw = (id, on, label, sub) => `<label class="row" for="${id}"><div class="grow"><b>${label}</b>${sub ? `<div class="muted">${sub}</div>` : ""}</div><span class="switch"><input type="checkbox" id="${id}" ${on ? "checked" : ""}><span></span></span></label>`;
    const tab = S.fTab === "check" ? "check" : "rad";
    const T = tab === "rad" ? S : S.ck;
    const where = tab === "rad" ? "ins Rad" : "in die Abhaken-Liste";
    sheet("Filter", `
      ${filterAdmin ? `<div class="row"><div class="grow muted">🔓 Angemeldet als Christoph</div><button class="btn small" type="button" id="logout">Abmelden</button></div>` : loginBox()}
      <div class="mode" id="fTabs" style="margin-bottom:6px"><button type="button" data-ft="rad" class="${tab === "rad" ? "on" : ""}">Fürs Drehen</button><button type="button" data-ft="check" class="${tab === "check" ? "on" : ""}">Fürs Abhaken</button></div>
      ${sw("f-incl", T.inclOnly, "Nur inklusive", "Drinks mit Aufpreis (z. B. Kir Royal 10,70 €) raus")}
      ${sw("f-af", T.allowAf, "Alkoholfreie Drinks", "Mocktails mit " + where + " nehmen")}
      <div class="cathead">Kategorien</div>
      ${Object.entries(CATS).map(([k, l]) => sw("c-" + k, T.cats[k], l, counts[k] + " Drinks")).join("")}
      <p class="muted" id="fcount"></p>`);
    const upd = () => { $("#fcount").textContent = tab === "rad" ? `Im Rad: ${enabled().length} Drinks. Einzelne Drinks kannst du unter „Karte“ abwählen.` : `In der Abhaken-Liste: ${checkEnabled().length} Drinks. Das Rad bleibt davon unberührt.`; };
    upd();
    overlay.querySelectorAll("[data-ft]").forEach(b => b.onclick = () => { S.fTab = b.dataset.ft; openSheet("filter"); });
    bindLogin("filter");
    const lo = $("#logout"); if (lo) lo.onclick = () => { filterAdmin = false; openSheet("filter"); };
    if (!filterAdmin) overlay.querySelectorAll(".switch input").forEach(i => i.disabled = true);
    $("#f-incl").onchange = e => { T.inclOnly = e.target.checked; save(); upd(); };
    $("#f-af").onchange = e => { T.allowAf = e.target.checked; save(); upd(); };
    Object.keys(CATS).forEach(k => { $("#c-" + k).onchange = e => { T.cats[k] = e.target.checked; save(); upd(); }; });
  }
  if (which === "mine") {
    if (!S.players.length) { sheet("Meine Drinks", `<p class="muted">Erst Spieler eintragen.</p>`); return; }
    if (S.myP == null || !S.players[S.myP]) S.myP = S.cur || 0;
    const p = S.players[S.myP];
    const sort = S.mySort || "new";
    let hs = S.history.filter(h => h.pid === p.id && BY_ID[h.id]);
    const rated = hs.filter(h => h.r);
    const avg = rated.length ? (rated.reduce((a, h) => a + h.r, 0) / rated.length).toLocaleString("de-DE", { maximumFractionDigits: 1 }) : "–";
    if (sort === "best") hs = hs.slice().sort((a, b) => (b.r || 0) - (a.r || 0) || b.t - a.t);
    if (sort === "open") hs = hs.filter(h => !h.r);
    const favBtn = id => { const on = p.fav.includes(id); return `<button class="fav ${on ? "on" : ""}" type="button" data-fav="${esc(id)}" aria-label="${on ? "Kein Favorit mehr" : "Als Favorit merken"}">${on ? "♥" : "♡"}</button>`; };
    const tabs = `<div class="players" style="margin-bottom:6px">${S.players.map((q, i) => `<button class="chip ${i === S.myP ? "on" : ""}" type="button" data-mp="${i}">${esc(q.name)}</button>`).join("")}</div>`;
    const sorts = `<div class="mode" id="mySort" style="margin:10px 0 2px;grid-template-columns:1fr 1fr 1fr 1fr">${[["new", "Neueste"], ["best", "Beste"], ["open", "Offen"], ["fav", "♥ Favs"]].map(([k, l]) => `<button type="button" data-ms="${k}" class="${sort === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
    const favItems = () => {
      const rows = p.fav.filter(id => BY_ID[id]).map(id => { const d = BY_ID[id]; const hs2 = S.history.filter(h => h.pid === p.id && h.id === id); const best = Math.max(0, ...hs2.map(h => h.r || 0));
        return `<div class="row srow"><div class="grow"><b>${esc(d.name)}</b>${tags(d)}<div class="muted">${esc(CATS[d.cat] || "")} · ${hs2.length ? hs2.length + "× getrunken" + (best ? " · " + "★".repeat(best) : "") : "noch nicht getrunken"}</div></div>${favBtn(id)}</div>`; }).join("");
      const opts = Object.entries(CATS).map(([c, l]) => `<optgroup label="${esc(l)}">${DRINKS.filter(d => d.cat === c && !p.fav.includes(d.id)).map(d => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join("")}</optgroup>`).join("");
      return `<label class="wahlrow"><span class="muted">Favorit hinzufügen</span><select id="favAdd"><option value="">Drink auswählen …</option>${opts}</select></label>${rows || `<p class="muted">Noch keine Favoriten. Herz bei einem Drink antippen oder oben einen auswählen.</p>`}`;
    };
    const items = sort === "fav" ? favItems() : hs.map(h => {
      const d = BY_ID[h.id];
      const t = new Date(h.t).toLocaleString("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit" });
      return `<div class="row srow" style="flex-wrap:wrap" data-q="${esc(d.name + " " + d.ing + " " + (CATS[d.cat] || ""))}"><div class="grow"><b>${esc(d.name)}</b>${tags(d)}<div class="muted">${esc(CATS[d.cat] || "")} · ${h.m ? "abgehakt " : ""}${t}</div></div><span style="display:inline-flex;align-items:center;gap:6px">${starsHTML(h)}${favBtn(h.id)}</span>${delBtn(h)}</div>`;
    }).join("");
    sheet("Meine Drinks", `${tabs}
      <div class="mysum"><div><b>${S.history.filter(h => h.pid === p.id && BY_ID[h.id]).length}</b><span>getrunken</span></div><div><b>${avg}</b><span>Ø Sterne</span></div><div><b>${S.history.filter(h => h.pid === p.id && BY_ID[h.id] && !h.r).length}</b><span>unbewertet</span></div></div>
      ${sorts}${searchBox("mine")}
      <p class="muted">Sterne antippen zum Bewerten oder Ändern, nochmal denselben Stern antippen löscht die Bewertung.${SY.code ? " Wird mit allen im Raum geteilt." : ""}</p>
      ${items || `<p class="muted">${sort === "open" ? "Alles bewertet. 🎉" : "Noch nichts gedreht."}</p>`}`);
    const reopen = () => { const y = overlay.querySelector(".sheet").scrollTop; openSheet("mine"); const sh = overlay.querySelector(".sheet"); if (sh) sh.scrollTop = y; };
    overlay.querySelectorAll("[data-fav]").forEach(b => b.onclick = () => { const id = b.dataset.fav; p.fav = p.fav.includes(id) ? p.fav.filter(x => x !== id) : [...p.fav, id]; save(); reopen(); });
    const fa = $("#favAdd"); if (fa) fa.onchange = () => { if (fa.value && !p.fav.includes(fa.value)) { p.fav = [...p.fav, fa.value]; save(); toast("♥ gemerkt"); } reopen(); };
    bindSearch();
    overlay.querySelectorAll("[data-mp]").forEach(b => b.onclick = () => { S.myP = +b.dataset.mp; openSheet("mine"); });
    overlay.querySelectorAll("[data-ms]").forEach(b => b.onclick = () => { S.mySort = b.dataset.ms; openSheet("mine"); });
  }
  if (which === "history") {
    const pmap = Object.fromEntries(S.players.map(p => [p.id, p.name]));
    const items = S.history.slice(0, 200).map(h => {
      const d = BY_ID[h.id]; if (!d) return "";
      const t = new Date(h.t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      return `<div class="row srow" style="flex-wrap:wrap" data-q="${esc((pmap[h.pid] || "") + " " + d.name + " " + d.ing)}"><div class="grow"><b>${esc(pmap[h.pid] || "Entfernt")}</b> · ${esc(d.name)}${tags(d)} <span class="muted" style="font-variant-numeric:tabular-nums">${t}</span></div>${starsHTML(h)}${delBtn(h)}</div>`;
    }).join("");
    const per = S.players.map(p => `<div class="row"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${p.seen.map(id => BY_ID[id] ? esc(BY_ID[id].name) : "").filter(Boolean).join(", ") || "noch nichts"}</div></div><span class="muted">${p.seen.length}</span></div>`).join("");
    const nOrph = S.history.filter(orphan).length;
    sheet("Verlauf", `${nOrph ? `<div class="row"><div class="grow"><b>${nOrph} Einträge ohne Haken</b><div class="muted">Stehen noch in Verlauf und Statistik, sind in der Abhaken-Liste aber nicht angehakt (Altlasten von früher).</div></div><button class="btn small warn delh" type="button" id="cleanOld">Aufräumen</button></div>` : ""}${S.history.length ? `<button class="btn small" type="button" id="undo">Letzten Dreh rückgängig</button>` : ""} ${S.history.some(h => h.rid) ? `<button class="btn small pri" type="button" id="lastOrder">Letzte Bestellung zeigen</button>` : ""}
      <div class="cathead">Pro Spieler</div>${per || `<p class="muted">Noch keine Spieler.</p>`}
      <div class="cathead">Zuletzt gedreht <span class="muted">(Sterne antippen zum Bewerten, falsch eingetragen? Löschen)</span></div>${items ? searchBox("history", "Drink oder Name suchen …") : ""}${items || `<p class="muted">Noch nichts gedreht.</p>`}`);
    bindSearch();
    const lr = S.history.find(h => h.rid); const ob = $("#lastOrder"); if (ob && lr) ob.onclick = () => showOrder(lr.rid);
    const u = $("#undo"); if (u) u.onclick = () => askCode(u, () => { undo(); openSheet("history"); });
    const cl = $("#cleanOld"); if (cl) cl.onclick = () => {
      askCode(cl.closest(".row") || cl, () => { const n = removeEntries(orphan); save(); renderTop(); toast(n + " Einträge entfernt."); openSheet("history"); });
    };
  }
  if (which === "stats") {
    // Zeitraum: ein Party-Tag geht von 6 Uhr bis 6 Uhr am nächsten Morgen (Handy-Uhrzeit)
    const ALL = S.history.slice().reverse().filter(h => BY_ID[h.id]);
    const day0 = t => { const d = new Date(t - 6 * 36e5); d.setHours(0, 0, 0, 0); return d.getTime() + 6 * 36e5; };
    const today = day0(Date.now()), yest = today - 864e5;
    const RANGES = { heute: ["Heute", h => h.t >= today], gestern: ["Gestern", h => h.t >= yest && h.t < today], alle: ["Ganze Reise", () => true] };
    if (!RANGES[statRange]) statRange = ALL.some(RANGES.heute[1]) ? "heute" : "alle";
    const rtabs = `<div class="players" style="margin-bottom:10px">${Object.entries(RANGES).map(([k, [l, f]]) => `<button class="chip ${k === statRange ? "on" : ""}" type="button" data-sr="${k}">${l} <small>${ALL.filter(f).length}</small></button>`).join("")}</div>`;
    const bindR = () => overlay.querySelectorAll("[data-sr]").forEach(b => b.onclick = () => { statRange = b.dataset.sr; openSheet("stats"); });
    const H = ALL.filter(RANGES[statRange][1]);
    if (!H.length) { sheet("Statistik", rtabs + `<p class="muted">${ALL.length ? (statRange === "heute" ? "Heute noch nichts gedreht. Ein Tag zählt hier von 6 Uhr morgens bis 6 Uhr am nächsten Morgen." : "An dem Tag wurde nichts gedreht.") : "Noch nichts gedreht. Nach den ersten Runden steht hier, wer wie viel hatte."}</p>`); bindR(); return; }
    const pmap = Object.fromEntries(S.players.map(p => [p.id, p.name]));
    const fmtT = t => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    const per = {};
    H.forEach(h => { (per[h.pid] = per[h.pid] || []).push(BY_ID[h.id]); });
    const rated = H.filter(h => h.r);
    const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
    const f1 = x => x.toFixed(1).replace(".", ",");
    const ratedBy = pid => rated.filter(h => h.pid === pid).sort((a, b) => b.r - a.r);
    const ranking = Object.entries(per).map(([pid, ds]) => ({ pid, name: pmap[pid] || "Entfernt", ds, cl: ds.reduce((s, d) => s + spiritCl(d), 0) }))
      .sort((a, b) => b.ds.length - a.ds.length || b.cl - a.cl);
    const max = ranking[0].ds.length;
    const top = (arr) => { const c = {}; arr.forEach(x => c[x] = (c[x] || 0) + 1); const e = Object.entries(c).sort((a, b) => b[1] - a[1]); return e.length ? e[0] : null; };
    const span = H[H.length - 1].t - H[0].t;
    const hrs = Math.max(span / 36e5, 0);
    const totalCl = ranking.reduce((s, r) => s + r.cl, 0);
    const kpis = `<div class="kpis"><div class="kpi"><b>${H.length}</b><span>Drinks</span></div><div class="kpi"><b>${hrs >= 1 ? hrs.toFixed(1).replace(".", ",") + " h" : Math.round(span / 6e4) + " min"}</b><span>${fmtT(H[0].t)}–${fmtT(H[H.length - 1].t)}</span></div><div class="kpi"><b>${(totalCl / 100).toFixed(1).replace(".", ",")} l</b><span>Schnaps ca.</span></div></div>`;
    const rank = ranking.map((r, i) => {
      const fav = top(r.ds.map(spiritOf).filter(Boolean));
      const cat = top(r.ds.map(d => CATS[d.cat]));
      return `<div class="row"><span class="medal">${i + 1}.</span><div class="grow"><b>${esc(r.name)}</b> <span class="muted">· ${r.ds.length} Drinks · ca. ${r.cl} cl Schnaps</span>
        <div class="bar"><i style="width:${Math.round(r.ds.length / max * 100)}%"></i></div>
        <div class="muted" style="margin-top:4px">Meistens ${fav ? esc(fav[0]) : "–"} · Lieblingskategorie ${cat ? esc(cat[0]) : "–"}</div>
        ${(() => { const rr = ratedBy(r.pid); if (!rr.length) return `<div class="muted">Noch nichts bewertet</div>`;
          const best = rr[0], worst = rr[rr.length - 1];
          return `<div class="muted">Ø ${f1(avg(rr.map(h => h.r)))} ★ · Top: ${esc(BY_ID[best.id].name)} (${best.r}★)${rr.length > 1 && worst.r < best.r ? ` · Flop: ${esc(BY_ID[worst.id].name)} (${worst.r}★)` : ""}</div>`; })()}</div></div>`;
    }).join("");
    // Zeitverlauf pro Stunde
    const start = new Date(H[0].t); start.setMinutes(0, 0, 0);
    const buckets = [];
    for (let t = start.getTime(); t <= H[H.length - 1].t; t += 36e5) buckets.push({ t, n: 0 });
    H.forEach(h => { const b = buckets[Math.floor((h.t - start.getTime()) / 36e5)]; if (b) b.n++; });
    const bmax = Math.max(...buckets.map(b => b.n));
    const hours = `<div class="hours">${buckets.slice(-24).map(b => `<div><em>${b.n || ""}</em><i style="height:${Math.round(b.n / bmax * 70)}px"></i>${new Date(b.t).getHours()}h</div>`).join("")}</div>`;
    const byDrink = {};
    rated.forEach(h => (byDrink[h.id] = byDrink[h.id] || []).push(h.r));
    const drinkAvg = Object.entries(byDrink).map(([id, rs]) => ({ d: BY_ID[id], a: avg(rs), n: rs.length })).sort((a, b) => b.a - a.a || b.n - a.n);
    const line = x => `<div class="row"><div class="grow"><b>${esc(x.d.name)}</b> <span class="muted">${x.n}× bewertet</span></div><b style="color:var(--gold);font-variant-numeric:tabular-nums">${f1(x.a)} ★</b></div>`;
    const tops = drinkAvg.slice(0, 3), flops = drinkAvg.length > 3 ? drinkAvg.slice(-3).reverse().filter(x => !tops.includes(x)) : [];
    const topflop = rated.length
      ? `<div class="cathead">Top-Drinks <span class="muted">(Ø ${f1(avg(rated.map(h => h.r)))} ★ aus ${rated.length} Bewertungen)</span></div>${tops.map(line).join("")}${flops.length ? `<div class="cathead">Flop-Drinks</div>${flops.map(line).join("")}` : ""}`
      : `<div class="cathead">Top & Flop</div><p class="muted">Noch keine Bewertungen. Bewertet wird auf dem Startbildschirm vor dem nächsten Dreh oder im Verlauf.</p>`;
    const spirits = top(H.map(h => spiritOf(BY_ID[h.id])).filter(Boolean));
    const longest = H.map(h => BY_ID[h.id]).sort((a, b) => b.ing.split(",").length - a.ing.split(",").length)[0];
    const paid = H.filter(h => BY_ID[h.id].price);
    const sum = paid.reduce((s, h) => s + parseFloat(BY_ID[h.id].price.replace(",", ".")), 0);
    const facts = `<div class="row"><div class="grow">Beliebteste Spirituose: <b>${spirits ? esc(spirits[0]) + " (" + spirits[1] + "×)" : "–"}</b></div></div>
      <div class="row"><div class="grow">Aufwendigster Drink: <b>${esc(longest.name)}</b> <span class="muted">(${longest.ing.split(",").length} Zutaten)</span></div></div>
      ${paid.length ? `<div class="row"><div class="grow">Mit Aufpreis: <b>${paid.length} Drinks, ${sum.toFixed(2).replace(".", ",")} €</b></div></div>` : ""}`;
    const text = `Drink-Rad Mein Schiff Flow – ${statRange === "alle" ? "ganze Reise ab " : ""}${new Date(H[0].t).toLocaleDateString("de-DE")}\n${H.length} Drinks, ${fmtT(H[0].t)}–${fmtT(H[H.length - 1].t)}\n\n` +
      ranking.map((r, i) => `${i + 1}. ${r.name}: ${r.ds.length} Drinks (ca. ${r.cl} cl Schnaps)\n   ${H.filter(h => h.pid === r.pid).map(h => BY_ID[h.id].name + (h.r ? " " + h.r + "★" : "")).join(", ")}`).join("\n") +
      (tops.length ? `\n\nTop: ${tops.map(x => x.d.name + " " + f1(x.a) + "★").join(", ")}` : "") +
      (flops.length ? `\nFlop: ${flops.map(x => x.d.name + " " + f1(x.a) + "★").join(", ")}` : "");
    sheet("Statistik", `${rtabs}${kpis}<div class="cathead">Rangliste</div>${rank}${topflop}<div class="cathead">Drinks pro Stunde</div>${hours}<div class="cathead">Fun Facts</div>${facts}
      <div class="row"><button class="btn pri" type="button" id="copyStats">Als Text kopieren</button><span class="muted">für die WhatsApp-Gruppe</span></div>
      <textarea id="statsText" readonly hidden style="width:100%;height:160px;background:var(--night);color:var(--foam);border-radius:12px;border:1.5px solid var(--line);padding:10px;font:inherit">${esc(text)}</textarea>
      <p class="muted">Heute und Gestern zählen jeweils von 6 Uhr morgens bis 6 Uhr am nächsten Morgen, die Nacht gehört also noch zum Abend davor.</p>
      <p class="muted">Schnaps-Menge ist eine grobe Schätzung: 4 cl pro Cocktail mit Spirituose, 2 cl bei Likör oder Bitter, Sekt und Wein nicht mitgezählt.</p>`);
    bindR();
    $("#copyStats").onclick = async () => {
      try { await navigator.clipboard.writeText(text); toast("Statistik kopiert."); }
      catch (e) { const ta = $("#statsText"); ta.hidden = false; ta.focus(); ta.select(); toast("Text markiert, jetzt kopieren."); }
    };
  }
  if (which === "check") {
    if (!S.players.length) { sheet("Abhaken", `<p class="muted">Erst Spieler eintragen.</p>`); return; }
    if (S.checkP == null || !S.players[S.checkP]) S.checkP = S.cur || 0;
    const p = S.players[S.checkP];
    const en = checkEnabled();
    const done = en.filter(d => p.seen.includes(d.id)).length;
    const tabs = `<div class="players" style="margin-bottom:6px">${S.players.map((q, i) => `<button class="chip ${i === S.checkP ? "on" : ""}" type="button" data-cp="${i}">${esc(q.name)}</button>`).join("")}</div>`;
    const groups = Object.entries(CATS).map(([k, l]) => {
      const ds = en.filter(d => d.cat === k); if (!ds.length) return "";
      const n = ds.filter(d => p.seen.includes(d.id)).length;

// ---------- Statistik-Helfer ----------
const SPIRITS = [
  ["Tequila", /tequila/i], ["Cachaça", /cachaça/i], ["Whisky", /whisk|bourbon|jim beam/i], ["Gin", /\bgin\b|sloe gin/i],
  ["Rum", /\brum\b|havana/i], ["Vodka", /vodka/i], ["Calvados", /calvados/i], ["Jägermeister", /jägermeister/i],
];
function spiritOf(d) {
  if (d.af) return null;
  if (d.cat === "pur") return d.ing.split(" ·")[0];
  if (d.cat === "bier") return "Bier";
  if (d.cat === "wein") return "Wein";
  if (d.cat === "schaum") return "Sekt & Champagner";
  for (const [n, re] of SPIRITS) if (re.test(d.ing)) return n;
  if (/likör|bitter|aperol|campari|malibu|baileys|kahlúa|cointreau|cassis|martini|wermut|lillet|pimm|port|sambuca|crème de|licor/i.test(d.ing)) return "Likör & Bitter";
  if (/sekt|wein|champagner|pils/i.test(d.ing)) return "Sekt & Wein";
  return null;
}
function spiritCl(d) {
  if (d.af) return 0;
  if (["bier", "wein", "schaum"].includes(d.cat)) return 0;
  if (d.cat === "shots") return 4; // ein Shot = ca. 4 cl
  if (d.cat === "pur") return parseInt(d.ing.match(/(\d+) cl/)?.[1] || "4", 10);
  const n = SPIRITS.filter(([, re]) => re.test(d.ing)).length;
  if (n) return Math.min(n * 4, 10);
  return spiritOf(d) === "Likör & Bitter" ? 2 : 0;
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"); c.hidden = false;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const parts = Array.from({ length: 90 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.4, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 4,
    r: Math.random() * 6 + 4, c: COLORS[Math.floor(Math.random() * COLORS.length)], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4,
  }));
  const t0 = performance.now();
  (function f(now) {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += p.va;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
    if (now - t0 < 1800) requestAnimationFrame(f); else { g.clearRect(0, 0, innerWidth, innerHeight); c.hidden = true; }
  })(t0);
}

        if (!p.ok) throw new Error("put " + p.status);
        SY.rev = Date.now() + "-" + Math.random().toString(36).slice(2, 6);
        await fb("/rev", { method: "PUT", body: JSON.stringify(SY.rev) });
      }
      SY.base = merged; SY.last = Date.now(); saveSY();
      if (!same(merged, local)) applyRemote(merged);
      setSyncState("ok");
      break;
    }
  } catch (e) {
    setSyncState(navigator.onLine === false ? "offline" : "error");
  } finally {
    syncBusy = false;
    if (syncAgain) { syncAgain = false; syncSoon(300); }
  }
}
// Abgehakte Drinks ohne Eintrag bekommen einen (manuell), doppelte manuelle Einträge werden zusammengelegt.
function fixManual() {
  let changed = false;
  const keep = new Map();
  for (const h of S.history.slice().sort((a, b) => a.t - b.t || (a.m ? 1 : 0) - (b.m ? 1 : 0))) {
    const k = h.pid + "|" + h.id;
    if (h.m === 2 && keep.has(k)) { const o = keep.get(k); if (!o.r && h.r) o.r = h.r; h._drop = 1; changed = true; }
    else if (!keep.has(k)) keep.set(k, h);
  }
  if (changed) S.history = S.history.filter(h => !h._drop);
  const now = Date.now();
  S.players.forEach((p, i) => p.seen.forEach((id, j) => {
    if (BY_ID[id] && !S.history.some(h => h.pid === p.id && h.id === id)) { S.history.push({ pid: p.id, id, t: now - 1000 * (p.seen.length - j), m: 2 }); changed = true; }
  }));
  if (changed) S.history.sort((a, b) => b.t - a.t);
  return changed;
}
function applyRemote(o) {
  if (DEMO) { try { const r = JSON.parse(REAL); fromShared(o, r); REAL = JSON.stringify(r); localStorage.setItem(KEY, REAL); } catch (e) {} return; }
  fromShared(o, S);
  if (fixManual()) syncSoon();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!overlay.innerHTML) render(); else renderTop();
  if (overlay.querySelector("#prizeBox") && !(document.activeElement && document.activeElement.tagName === "SELECT")) openPrize();
}

}

function newCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "";
  for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)];
  return s;
}
const cleanCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);

// ---------- Abgleich ohne Internet per QR-Code ----------
// Handy A zeigt seinen Stand als laufende Folge von QR-Codes, Handy B scannt sie mit der Kamera und führt
// mit derselben Logik wie beim Raum zusammen. Danach umgekehrt, dann haben beide alles.
function loadScript(src) {
  return new Promise((ok, fail) => { if (document.querySelector(`script[data-src="${src}"]`)) return ok(); const s = document.createElement("script"); s.src = src; s.dataset.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}
const b64 = { enc: u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }, dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
async function packState() {
  const json = new TextEncoder().encode(JSON.stringify(toShared(S)));
  if (typeof CompressionStream === "undefined") return "J" + b64.enc(json);
  const z = new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
  return "Z" + b64.enc(z);
}
async function unpackState(s) {
  const raw = b64.dec(s.slice(1));
  const bytes = s[0] === "Z" ? new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()) : raw;
  return JSON.parse(new TextDecoder().decode(bytes));
}
let qrTimer = 0, qrStream = null, qrRaf = 0;
function stopQr() {
  clearInterval(qrTimer); qrTimer = 0; cancelAnimationFrame(qrRaf); qrRaf = 0;
  if (qrStream) { qrStream.getTracks().forEach(t => t.stop()); qrStream = null; }
}
function openQrSheet() {
  if (spinning) return;
  if (DEMO) { toast("Im Demo-Modus geht kein Abgleich."); return; }
  stopQr();
  sheet("Ohne Internet abgleichen", `<p class="muted">So geht's ohne Netz: Ein Handy tippt <b>Zeigen</b>, das andere <b>Scannen</b> und hält die Kamera drauf, bis alle Teile da sind. Danach tauscht ihr die Rollen, dann haben beide alles.</p>
    <div class="actions" style="margin-top:10px"><button class="btn pri" type="button" id="qrShow">Zeigen</button><button class="btn pri" type="button" id="qrScan">Scannen</button></div>
    <div id="qrArea"></div>`);
  $("#closeX").onclick = () => { stopQr(); closeSheet(); };
  $("#qrShow").onclick = showQr;
  $("#qrScan").onclick = scanQr;
}
async function showQr() {
  stopQr();
  const area = $("#qrArea"); area.innerHTML = `<p class="muted">Wird vorbereitet …</p>`;
  try { await loadScript("qrcode.js"); } catch (e) { area.innerHTML = `<p class="muted">QR-Baustein fehlt. Einmal mit Internet öffnen, dann geht es auch offline.</p>`; return; }
  const data = await packState();
  const id = Math.random().toString(36).slice(2, 6), size = 500;
  const parts = []; for (let i = 0; i < data.length; i += size) parts.push(data.slice(i, i + size));
  const frames = parts.map((p, i) => { const q = qrcode(0, "L"); q.addData(`DR1|${id}|${i}|${parts.length}|${p}`); q.make(); return q.createSvgTag({ cellSize: 6, margin: 4, scalable: true }); });
  area.innerHTML = `<div class="qrbox" id="qrBox"></div><p class="muted" style="text-align:center" id="qrInfo"></p>`;
  let k = 0; const tick = () => { $("#qrBox").innerHTML = frames[k]; $("#qrInfo").textContent = `Teil ${k + 1} von ${frames.length} · läuft in Schleife`; k = (k + 1) % frames.length; };
  tick(); if (frames.length > 1) qrTimer = setInterval(() => { if (!$("#qrBox")) return stopQr(); tick(); }, 700);
}
async function scanQr() {
  stopQr();
  const area = $("#qrArea"); area.innerHTML = `<p class="muted">Kamera wird gestartet …</p>`;
  try { await loadScript("jsqr.js"); } catch (e) { area.innerHTML = `<p class="muted">Scan-Baustein fehlt. Einmal mit Internet öffnen, dann geht es auch offline.</p>`; return; }
  try { qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); }
  catch (e) { area.innerHTML = `<p class="muted">Kein Kamerazugriff. Bitte in den iPhone-Einstellungen die Kamera für Safari erlauben.</p>`; return; }
  area.innerHTML = `<video id="qrVid" class="qrvid" playsinline muted></video><p class="muted" style="text-align:center" id="qrInfo">Kamera auf den QR-Code halten …</p>`;
  const v = $("#qrVid"); v.srcObject = qrStream; await v.play().catch(() => {});
  const c = document.createElement("canvas"), g = c.getContext("2d", { willReadFrequently: true });
  const got = {}; let want = 0, sid = "";
  const loop = async () => {
    if (!qrStream || !document.getElementById("qrVid")) return stopQr();
    if (v.readyState >= 2) {
      const w = 480, h = Math.round(v.videoHeight / v.videoWidth * w) || 360; c.width = w; c.height = h;
      g.drawImage(v, 0, 0, w, h);
      const r = jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
      const m = r && /^DR1\|(\w+)\|(\d+)\|(\d+)\|(.*)$/s.exec(r.data);
      if (m) {
        if (m[1] !== sid) { sid = m[1]; want = +m[3]; for (const k in got) delete got[k]; }
        got[+m[2]] = m[4];
        const n = Object.keys(got).length;
        $("#qrInfo").textContent = `${n} von ${want} Teilen empfangen …`;
        if (n === want) { stopQr(); return finishQr(Array.from({ length: want }, (_, i) => got[i]).join("")); }
      }
    }
    qrRaf = requestAnimationFrame(loop);
  };
  loop();
}
async function finishQr(data) {
  try {
    const remote = await unpackState(data);
    const local = toShared(S);
    const merged = prune(stripGone(merge3(SY.code ? SY.base : {}, local, remote), [local, remote])) || {};
    fromShared(merged, S); fixManual();
    save(); render();
    $("#qrArea").innerHTML = `<p class="muted"><b style="color:var(--sea)">Abgeglichen!</b> Jetzt das andere Handy scannen lassen (hier auf <b>Zeigen</b> tippen), dann haben beide denselben Stand.</p>`;
    toast("Stand übernommen.");
  } catch (e) { $("#qrArea").innerHTML = `<p class="muted">Das hat nicht geklappt. Bitte nochmal scannen.</p>`; }
}
