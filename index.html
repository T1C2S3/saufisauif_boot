<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one-screen party app, wheel center stage, player strip above, sheets slide up from below. Single dark "ship deck at night" look by choice. */
:root {
  --night: #0b1830;
  --deck: #13254a;
  --deck-2: #1b3160;
  --line: #2b4377;
  --foam: #eef3ff;
  --mist: #a9b8d8;
  --coral: #ff6b57;
  --gold: #ffc94a;
  --sea: #2ec4b6;
  --violet: #8b7bff;
  --pink: #ff7eb6;
  --lime: #b5e655;
  --ink: #0b1830;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 0%, #1d3a72 0%, var(--night) 60%) fixed, var(--night);
  color: var(--foam);
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 24px;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.01em; margin: 0; line-height: 1; }
h1 span { color: var(--coral); }
.sub { color: var(--mist); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }

.roompill { appearance: none; border: 1.5px solid var(--line); background: var(--deck); color: var(--mist); border-radius: 99px; padding: 6px 12px; font: 700 .78rem var(--body); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.roompill.on { color: var(--foam); border-color: var(--sea); }
.roompill i { width: 8px; height: 8px; border-radius: 50%; background: var(--sea); flex: 0 0 auto; }
.roompill small { color: var(--mist); font-weight: 600; }
.roompill.wait i { background: var(--gold); }
.roompill.offline, .roompill.error { border-color: var(--line); }
.roompill.offline i, .roompill.error i { background: var(--mist); }
.roomcode { font: 800 2.6rem var(--display); letter-spacing: .14em; text-align: center; color: var(--gold); margin: 6px 0 2px; }

.ver { text-align: center; color: var(--mist); font-size: .72rem; opacity: .7; padding: 2px 0 6px; font-variant-numeric: tabular-nums; }

/* players */
.players { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.players::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--deck); color: var(--foam);
  border-radius: 999px; padding: 8px 14px; font: 600 .95rem var(--body); display: flex; gap: 8px; align-items: center;
}
.chip small { color: var(--mist); font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.chip.on small { color: #5a4200; }
.chip.add { color: var(--mist); border-style: dashed; }

/* wheel */
.stage { position: relative; display: grid; place-items: center; padding-top: 14px; }
.wheel-wrap { position: relative; width: min(88vw, 400px); aspect-ratio: 1; max-width: 100%; }
#wheel { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 0 0 6px var(--deck-2), 0 0 0 9px var(--gold), 0 20px 50px rgba(0,0,0,.5); touch-action: manipulation; }
.pointer {
  position: absolute; left: 50%; top: -18px; transform: translateX(-50%); width: 34px; height: 44px; z-index: 2;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.4));
}
.hub {
  position: absolute; inset: 0; margin: auto; width: 23%; height: 23%; border-radius: 50%;
  background: var(--night); border: 4px solid var(--gold); display: grid; place-items: center;
  font: 800 1rem var(--display); color: var(--gold); letter-spacing: .02em; pointer-events: none;
}
.turn { text-align: center; display: grid; gap: 4px; }
.turn b { font-family: var(--display); font-size: 1.35rem; font-weight: 800; }
.turn .left { color: var(--mist); font-size: .9rem; font-variant-numeric: tabular-nums; }
.spin {
  appearance: none; border: 0; border-radius: 18px; padding: 18px; width: 100%;
  background: var(--coral); color: #fff; font: 800 1.35rem var(--display); letter-spacing: .02em;
  box-shadow: 0 6px 0 #b8402f; transition: transform .08s, box-shadow .08s;
}
.spin:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8402f; }
.spin:disabled { opacity: .55; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tool { font-size: .78rem !important; }
.tool.mine { grid-column: 1 / -1; display: flex; align-items: center; flex-direction: row; justify-content: center; gap: 8px; font-size: .9rem !important; }
.mysum { display: flex; gap: 8px; margin: 4px 0 2px; }
.mysum div { flex: 1; background: var(--night); border-radius: 12px; padding: 8px; text-align: center; }
.mysum b { display: block; font: 800 1.3rem var(--display); color: var(--gold); }
.mysum span { font-size: .72rem; color: var(--mist); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
.kpi { background: var(--night); border-radius: 14px; padding: 10px; text-align: center; }
.kpi b { display: block; font: 800 1.5rem var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.kpi span { font-size: .75rem; color: var(--mist); }
.bar { height: 10px; border-radius: 99px; background: var(--night); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--coral); border-radius: 99px; }
.medal { font: 800 1.1rem var(--display); width: 28px; color: var(--gold); font-variant-numeric: tabular-nums; }
.hours { display: flex; align-items: flex-end; gap: 4px; height: 110px; padding-top: 18px; overflow-x: auto; }
.hours div { flex: 1 0 22px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: .7rem; color: var(--mist); font-variant-numeric: tabular-nums; }
.hours i { display: block; width: 100%; background: var(--sea); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.hours em { font-style: normal; color: var(--foam); font-weight: 700; }
.mode { display: grid; grid-template-columns: 1fr 1fr; background: var(--deck); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.mode button { appearance: none; border: 0; border-radius: 10px; padding: 9px; font: 700 .95rem var(--body); background: transparent; color: var(--mist); }
.mode button.on { background: var(--sea); color: var(--ink); }
.orow { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cnt { font: 800 2rem var(--display); color: var(--gold); min-width: 52px; font-variant-numeric: tabular-nums; }
.oname { font: 800 1.35rem/1.15 var(--display); }
.stars { display: inline-flex; gap: 2px; flex: 0 0 auto; }
.stars button { appearance: none; border: 0; background: none; padding: 2px; font-size: 1.5rem; line-height: 1; color: var(--line); }
.stars button.on { color: var(--gold); }
.ratecard { background: var(--deck); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ratecard .grow { min-width: 0; flex: 1 1 140px; }
.ratecard .stars button { font-size: 1.9rem; }
.tool {
  appearance: none; border: 1.5px solid var(--line); background: var(--deck); color: var(--foam);
  border-radius: 14px; padding: 10px 4px; font: 600 .85rem var(--body); display: grid; gap: 4px; justify-items: center;
}
.tool svg { width: 22px; height: 22px; stroke: var(--gold); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }

/* overlays */
.scrim { position: fixed; inset: 0; background: rgba(5,10,25,.7); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; background: var(--deck);
  border-radius: 22px 22px 0 0; border-top: 3px solid var(--gold);
  padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  animation: up .25s ease-out; -webkit-user-select: text; user-select: text;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet h2 { font: 800 1.4rem var(--display); margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
.x { appearance: none; border: 0; background: var(--deck-2); color: var(--foam); width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; }
.row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.muted { color: var(--mist); font-size: .85rem; }
input[type=text] {
  width: 100%; font: 600 1rem var(--body); color: var(--foam); background: var(--night);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px;
}
.btn { appearance: none; border: 0; border-radius: 12px; padding: 11px 14px; font: 700 .95rem var(--body); background: var(--deck-2); color: var(--foam); }
.btn.pri { background: var(--gold); color: var(--ink); }
.btn.warn { background: transparent; border: 1.5px solid var(--coral); color: var(--coral); }
.btn.small { padding: 7px 10px; font-size: .85rem; }
.switch { position: relative; width: 50px; height: 30px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .2s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + span { background: var(--sea); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--sea); outline-offset: 2px; }
.cathead { font: 800 1.05rem var(--display); margin: 18px 0 2px; color: var(--gold); }
.drinkline { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.drinkline input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--sea); flex: 0 0 auto; }
.drinkline .grow { flex: 1; min-width: 0; }
.drinkline.off .name { text-decoration: line-through; color: var(--mist); }
.name { font-weight: 700; }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
.tag.price { background: var(--coral); color: #fff; }
.tag.af { background: var(--sea); color: var(--ink); }
.tag.guess { background: var(--violet); color: #fff; }
.tag.done { background: var(--deck-2); color: var(--mist); }

/* result */
.result { text-align: center; padding-top: 8px; }
.result .who { color: var(--mist); text-transform: uppercase; letter-spacing: .1em; font-size: .8rem; font-weight: 700; }
.result .drink { font: 800 2.2rem/1.05 var(--display); margin: 10px 0 8px; text-wrap: balance; color: var(--gold); }
.result .ing { font-size: 1.05rem; line-height: 1.45; color: var(--foam); max-width: 34ch; margin: 0 auto; }
.result .meta { margin: 12px 0 18px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.result .meta .tag { margin: 0; font-size: .8rem; padding: 4px 10px; }
.tag.cat { background: var(--deck-2); color: var(--foam); }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--sea); color: var(--ink); font-weight: 700; padding: 12px 18px; border-radius: 14px; z-index: 40;
  max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>Drink<span>·</span>Rad</h1>
    <button class="roompill" id="roomBtn" type="button">Gemeinsam spielen</button>
  </header>

  <div class="players" id="players"></div>

  <div class="stage">
    <div class="wheel-wrap">
      <svg class="pointer" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 44 L2 10 A16 16 0 0 1 32 10 Z" fill="#ffc94a" stroke="#0b1830" stroke-width="2"/><circle cx="17" cy="14" r="5" fill="#0b1830"/></svg>
      <canvas id="wheel" aria-label="Glücksrad mit Drinks"></canvas>
      <div class="hub">PROST</div>
    </div>
  </div>

  <div class="turn" aria-live="polite">
    <b id="turnName">–</b>
    <span class="left" id="turnLeft"></span>
  </div>
  <div id="rateCard"></div>

  <div class="mode" id="modeSw" role="group" aria-label="Spielmodus"><button type="button" data-mode="single">Einzeln</button><button type="button" data-mode="round">Runde (alle)</button></div>
  <button class="spin" id="spinBtn" type="button">Drehen!</button>

  <div class="tools">
    <button class="tool mine" type="button" data-open="mine"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>Meine Drinks &amp; Bewertungen</button>

    <button class="tool" type="button" data-open="filter"><svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>Filter</button>
    <button class="tool" type="button" data-open="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Verlauf</button>
    <button class="tool" type="button" data-open="menu"><svg viewBox="0 0 24 24"><path d="M8 3h8l-1 7a3 3 0 0 1-6 0zM12 13v7M8 21h8"/></svg>Karte</button>
    <button class="tool" type="button" data-open="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistik</button>
    <button class="tool" type="button" data-open="check"><svg viewBox="0 0 24 24"><path d="M4 6h2M4 12h2M4 18h2M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1 1 2-2"/></svg>Abhaken</button>
  </div>
  <div class="ver" id="ver"></div>
</div>

<div id="overlay"></div>
<canvas class="confetti" id="confetti" hidden></canvas>

const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const DRINKS = RAW.map(([name, ing, price, cat, af]) => ({ id: cat + ":" + slug(name), name, ing, price, cat, af: !!af }));
const BY_ID = Object.fromEntries(DRINKS.map(d => [d.id, d]));

// ---------- Zustand ----------
const APP_VERSION = "6"; // bei jedem Update hochzählen (gleich wie VERSION in sw.js)
const KEY = "drinkrad-flow-v1";
const NAMES = ["Christoph","Mark","Tim","Julian"];
const DEFAULT = () => ({
  players: NAMES.map((n, i) => ({ id: "p" + i + Date.now().toString(36), name: n, seen: [] })),
  cur: 0,
  cats: Object.fromEntries(Object.keys(CATS).map(k => [k, true])),
  inclOnly: true,
  allowAf: false,
  v: 2,
  excluded: [],
  history: [],
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || DEFAULT(); } catch (e) { S = DEFAULT(); }
S = Object.assign(DEFAULT(), S);
for (const k of Object.keys(CATS)) if (!(k in S.cats)) S.cats[k] = true;
if (S.players.length && S.players.every(p => /^Spieler \d+$/.test(p.name))) {
  S.players = DEFAULT().players; S.history = []; S.cur = 0;
}
if (S.v !== 2) { S.inclOnly = true; S.allowAf = false; S.v = 2; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} syncSoon(); };

const enabled = () => DRINKS.filter(d =>
  S.cats[d.cat] && (!S.inclOnly || !d.price) && (S.allowAf || !d.af) && !S.excluded.includes(d.id));
const player = () => S.players[S.cur] || null;
const poolFor = p => { const en = enabled(); return en.filter(d => !p.seen.includes(d.id)); };

// ---------- Rad ----------
const cv = document.getElementById("wheel");
const ctx = cv.getContext("2d");
const COLORS = ["#ff6b57","#ffc94a","#2ec4b6","#8b7bff","#ff7eb6","#b5e655"];
const TEXT_ON = { "#ff6b57":"#fff", "#ffc94a":"#0b1830", "#2ec4b6":"#0b1830", "#8b7bff":"#fff", "#ff7eb6":"#0b1830", "#b5e655":"#0b1830" };
const MAX_SEG = 12;
let segs = [];      // drinks currently shown on the wheel
let rot = 0;        // radians
let spinning = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function refillSegs() {
  const p = player();
  const pool = p ? poolFor(p) : enabled();
  segs = shuffle(pool.slice()).slice(0, MAX_SEG);
}
function segColor(i, n) {
  let c = i % COLORS.length;
  if (n > 1 && i === n - 1 && c === 0) c = 2;
  return COLORS[c];
}
function sizeCanvas() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  draw();
}
function short(s, max) { return s.length > max ? s.slice(0, max - 1).trimEnd() + "…" : s; }
function draw() {
  const W = cv.width, R = W / 2;
  ctx.clearRect(0, 0, W, W);
  ctx.save(); ctx.translate(R, R); ctx.rotate(rot);
  const n = Math.max(segs.length, 1);
  const a = Math.PI * 2 / n;
  if (!segs.length) {
    ctx.fillStyle = "#1b3160"; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#a9b8d8"; ctx.font = `600 ${W * 0.045}px Figtree, system-ui`; ctx.textAlign = "center";
    ctx.fillText("Keine Drinks im Filter", R, R * 0.55);
    return;
  }
  for (let i = 0; i < n; i++) {
    const s = -Math.PI / 2 + i * a;
    const col = segColor(i, n);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, s, s + a); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = "#0b1830"; ctx.lineWidth = W * 0.006; ctx.stroke();
    // label
    ctx.save();
    ctx.rotate(s + a / 2);
    ctx.fillStyle = TEXT_ON[col];
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    const fs = Math.max(W * 0.032, Math.min(W * 0.05, W * 0.33 / n));
    ctx.font = `700 ${fs}px Figtree, -apple-system, system-ui, sans-serif`;
    const maxChars = n <= 6 ? 20 : 17;
    ctx.fillText(short(segs[i].name, maxChars), R * 0.93, 0);
    ctx.restore();
  }
  ctx.restore();
}

function prepPool(p) {
  let pool = poolFor(p);
  const en = enabled();
  if (!en.length) return null;
  if (!pool.length) {
    const enIds = new Set(en.map(d => d.id));
    p.seen = p.seen.filter(id => !enIds.has(id));
    save();
    toast(`${p.name} hat alles durch! Alle Drinks wieder drin.`);
    pool = poolFor(p);
  }
  return pool;
}
function spinFor(p, dur, rid) {
  return new Promise(resolve => {
    const pool = prepPool(p);
    if (!pool) { resolve(null); return; }
    const winner = pool[Math.floor(Math.random() * pool.length)];
    if (!segs.some(d => d.id === winner.id) || segs.length === 0) refillSegsWith(winner, pool);
    const w = segs.findIndex(d => d.id === winner.id);
    const n = segs.length, a = Math.PI * 2 / n;
    const jitter = (Math.random() - 0.5) * a * 0.6;
    const target = -(w + 0.5) * a - jitter;
    const TAU = Math.PI * 2;
    const m = Math.ceil((rot + TAU * (dur > 3000 ? 5 : 3) - target) / TAU);
    const end = target + TAU * m;
    const start = rot;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) dur = 600;
    const t0 = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 4);
    (function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      rot = start + (end - start) * ease(t);
      draw();
      if (t < 1) requestAnimationFrame(frame);
      else {
        rot = end % TAU;
        p.seen.push(winner.id);
        const h = { pid: p.id, id: winner.id, t: Date.now() };
        if (rid) h.rid = rid;
        S.history.unshift(h);
        save();
        resolve(winner);
      }
    })(t0);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function setBusy(b) { spinning = b; document.getElementById("spinBtn").disabled = b; }
async function spin() {
  if (spinning) return;
  if (!S.players.length) { openSheet("players"); return; }
  if (!enabled().length) { toast("Kein Drink passt zum Filter. Bitte Filter lockern."); openSheet("filter"); return; }
  if (S.mode === "round") return spinRound();
  const p = player();
  setBusy(true);
  const d = await spinFor(p, 4800);
  setBusy(false);
  if (d) { confetti(); showResult(p, d); }
}
async function spinRound() {
  setBusy(true);
  const rid = "r" + Date.now().toString(36);
  const got = [];
  for (let i = 0; i < S.players.length; i++) {
    S.cur = i; save(); renderTop(); refillSegs(); draw();
    $("#turnName").textContent = `${S.players[i].name} dreht …`;
    await wait(350);
    const p = S.players[i];
    const d = await spinFor(p, 2600, rid);
    if (d) { got.push({ p, d }); toast(`${p.name}: ${d.name}`); renderTop(); }
    await wait(900);
  }
  S.cur = 0; save();
  setBusy(false);
  confetti();
  showOrder(rid);
}
function showOrder(rid) {
  const pmap = Object.fromEntries(S.players.map(p => [p.id, p.name]));
  const hs = S.history.filter(h => h.rid === rid && BY_ID[h.id]).reverse();
  if (!hs.length) { toast("Keine Bestellung gefunden."); return; }
  const groups = {};
  hs.forEach(h => (groups[h.id] = groups[h.id] || []).push(pmap[h.pid] || "?"));
  const total = Object.values(groups).reduce((s, g) => s + g.length, 0);
  const paid = hs.filter(h => BY_ID[h.id].price);
  overlay.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-label="Bestellung">
    <h2>Bestellung für die Bar<button class="x" type="button" aria-label="Schließen" id="closeX">✕</button></h2>
    <p class="muted">${total} Drinks · zum Vorzeigen am Tresen</p>
    <div class="order">${Object.entries(groups).map(([id, names]) => `<div class="orow"><span class="cnt">${names.length}×</span><div class="grow"><div class="oname">${esc(BY_ID[id].name)}</div><div class="muted">${esc(names.join(", "))}${BY_ID[id].price ? ` · <b style="color:var(--coral)">${esc(BY_ID[id].price)}</b>` : ""}</div></div></div>`).join("")}</div>
    ${paid.length ? `<p class="muted">${paid.length} Drink(s) mit Aufpreis.</p>` : ""}
    <div class="cathead">Wer bekommt was</div>
    ${hs.map(h => `<div class="row"><div class="grow"><b>${esc(pmap[h.pid] || "?")}</b> · ${esc(BY_ID[h.id].name)}<div class="muted">${esc(BY_ID[h.id].ing)}</div></div></div>`).join("")}
    <div class="actions" style="margin-top:14px">
      <button class="btn warn" type="button" id="oRedo">Runde neu</button>
      <button class="btn pri" type="button" id="oOk">Bestellt, Prost!</button>
    </div></div></div>`;
  $("#closeX").onclick = closeSheet;
  $("#oOk").onclick = closeSheet;
  $("#oRedo").onclick = () => {
    S.history.filter(h => h.rid === rid).forEach(h => { const p = S.players.find(x => x.id === h.pid); if (p) { const k = p.seen.lastIndexOf(h.id); if (k >= 0) p.seen.splice(k, 1); } });
    S.history = S.history.filter(h => h.rid !== rid); S.cur = 0; save(); toast("Runde zurückgenommen."); closeSheet();
  };
}
function refillSegsWith(winner, pool) {
  const others = shuffle(pool.filter(d => d.id !== winner.id)).slice(0, MAX_SEG - 1);
  segs = shuffle([winner, ...others]);
  draw();
}

function land(p, d) {

  p.seen.push(d.id);
  S.history.unshift({ pid: p.id, id: d.id, t: Date.now() });
  save();
  confetti();
  showResult(p, d);
}

// ---------- UI ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function renderTop() {
  const el = $("#players");
  el.innerHTML = S.players.map((p, i) =>
    `<button class="chip ${i === S.cur ? "on" : ""}" type="button" data-pi="${i}">${esc(p.name)} <small>${p.seen.length}</small></button>`
  ).join("") + `<button class="chip add" type="button" data-open="players">+ Spieler</button>`;
  renderRateCard();
  document.querySelectorAll("#modeSw button").forEach(b => b.classList.toggle("on", b.dataset.mode === (S.mode || "single")));
  $("#spinBtn").textContent = S.mode === "round" ? "Runde drehen!" : "Drehen!";
  const p = player();
  const en = enabled();
  if (!p) { $("#turnName").textContent = "Erst Spieler eintragen"; $("#turnLeft").textContent = ""; }
  else {
    const left = poolFor(p).length;
    $("#turnName").textContent = S.mode === "round" ? `Runde für alle ${S.players.length}` : `${p.name} ist dran`;
    $("#turnLeft").textContent = left
      ? `Noch ${left} von ${en.length} Drinks offen`
      : `Alle ${en.length} Drinks durch – nächster Dreh startet neu`;
  }
}
function render() { renderTop(); refillSegs(); draw(); }

// ---------- Bewertung ----------
function starsHTML(h, big) {
  return `<span class="stars" role="group" aria-label="Bewertung">${[1,2,3,4,5].map(v => `<button type="button" class="${(h.r || 0) >= v ? "on" : ""}" data-star="${h.t}:${h.pid}:${v}" aria-label="${v} Sterne">★</button>`).join("")}</span>`;
}
function renderRateCard() {
  const el = $("#rateCard");
  let p = player();
  if (S.mode === "round") p = S.players.find(q => { const x = S.history.find(y => y.pid === q.id); return x && !x.r; }) || p;
  const h = p && S.history.find(x => x.pid === p.id);
  if (!h || h.r || !BY_ID[h.id]) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="ratecard"><div class="grow"><b>${esc(p.name)}, wie war ${esc(BY_ID[h.id].name)}?</b><div class="muted">Kurz bewerten vor dem nächsten Dreh</div></div>${starsHTML(h)}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-star]"); if (!b) return;
  const [t, pid, v] = b.dataset.star.split(":");
  const h = S.history.find(x => String(x.t) === t && x.pid === pid); if (!h) return;
  h.r = (h.r === +v) ? 0 : +v; save();
  b.parentElement.querySelectorAll("button").forEach((x, i) => x.classList.toggle("on", i < h.r));
  if (b.closest("#rateCard")) { toast(`${h.r} ★ gespeichert`); setTimeout(renderRateCard, 500); }
  if (overlay.querySelector("#mySort")) setTimeout(() => { if (!overlay.querySelector("#mySort")) return; const y = overlay.querySelector(".sheet").scrollTop; openSheet("mine"); const sh = overlay.querySelector(".sheet"); if (sh) sh.scrollTop = y; }, 450);
});

$("#players").addEventListener("click", e => {
  const b = e.target.closest("[data-pi]");
  if (b && !spinning) { S.cur = +b.dataset.pi; save(); render(); }
});
$("#spinBtn").addEventListener("click", spin);
$("#modeSw").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (!b || spinning) return; S.mode = b.dataset.mode; S.cur = S.mode === "round" ? 0 : S.cur; save(); render(); });
cv.addEventListener("click", spin);
document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.open)));
document.addEventListener("click", e => { const b = e.target.closest(".chip.add"); if (b) openSheet("players"); });

const overlay = $("#overlay");
function closeSheet() { overlay.innerHTML = ""; render(); }
function sheet(title, body) {
  overlay.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}<button class="x" type="button" aria-label="Schließen" id="closeX">✕</button></h2>${body}</div></div>`;
  $("#closeX").onclick = closeSheet;
  $("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
}
function tags(d) {
  return (d.price ? `<span class="tag price">${esc(d.price)}</span>` : "") + (d.af ? `<span class="tag af">alkoholfrei</span>` : "");
}

function openSheet(which) {
  if (spinning) return;
  if (which === "players") {
    sheet("Spieler", `
      <div id="plist">${S.players.map((p, i) => `
        <div class="row">
          <div class="grow"><input type="text" id="pn-${esc(p.id)}" value="${esc(p.name)}" data-rename="${i}" aria-label="Name von Spieler ${i + 1}"></div>
          <span class="muted" style="font-variant-numeric:tabular-nums">${p.seen.length}🍹</span>
          <button class="btn small warn" type="button" data-del="${i}">Entfernen</button>
        </div>`).join("")}</div>
      <form class="row" id="addForm">
        <div class="grow"><input type="text" id="newName" placeholder="Neuer Name" autocomplete="off" enterkeyhint="done"></div>
        <button class="btn pri" type="submit">Hinzufügen</button>
      </form>
      <p class="muted">Tipp: Antippen eines Namens oben wählt, wer dreht. Der gewählte Spieler bleibt, bis ihr oben jemand anderen antippt.</p>
      <div class="row"><div class="grow"><b>Alle Drinks zurücksetzen</b><div class="muted">Spieler bleiben, alle getrunkenen Drinks und der Verlauf werden gelöscht.</div></div>
        <button class="btn small warn" type="button" id="resetAll">Zurücksetzen</button></div>
      <div id="confirmBox"></div>`);
    overlay.querySelectorAll("[data-rename]").forEach(inp => inp.addEventListener("input", () => {
      const p = S.players[+inp.dataset.rename]; p.name = inp.value.trim() || p.name; save(); renderTop();
    }));
    overlay.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.del; S.players.splice(i, 1);
      if (S.cur >= S.players.length) S.cur = 0; save(); renderTop(); openSheet("players");
    }));
    $("#addForm").addEventListener("submit", e => {
      e.preventDefault(); const n = $("#newName").value.trim(); if (!n) return;
      S.players.push({ id: "p" + Date.now().toString(36), name: n, seen: [] }); save(); renderTop(); openSheet("players");
      setTimeout(() => { const x = $("#newName"); x && x.focus(); }, 50);
    });
    $("#resetAll").addEventListener("click", () => {
      $("#confirmBox").innerHTML = `<div class="row"><div class="grow"><b>Wirklich alles zurücksetzen?</b></div><button class="btn small" type="button" id="noReset">Abbrechen</button><button class="btn small pri" type="button" id="yesReset">Ja</button></div>`;
      $("#noReset").onclick = () => $("#confirmBox").innerHTML = "";
      $("#yesReset").onclick = () => { S.players.forEach(p => p.seen = []); S.history = []; S.cur = 0; save(); toast("Alles zurückgesetzt."); closeSheet(); };
    });
  }
  if (which === "filter") {
    const counts = {}; DRINKS.forEach(d => counts[d.cat] = (counts[d.cat] || 0) + 1);
    const sw = (id, on, label, sub) => `<label class="row" for="${id}"><div class="grow"><b>${label}</b>${sub ? `<div class="muted">${sub}</div>` : ""}</div><span class="switch"><input type="checkbox" id="${id}" ${on ? "checked" : ""}><span></span></span></label>`;
    sheet("Filter", `
      ${sw("f-incl", S.inclOnly, "Nur inklusive", "Drinks mit Aufpreis (z. B. Kir Royal 10,70 €) raus")}
      ${sw("f-af", S.allowAf, "Alkoholfreie Drinks", "Mocktails mit ins Rad nehmen")}
      <div class="cathead">Kategorien</div>
      ${Object.entries(CATS).map(([k, l]) => sw("c-" + k, S.cats[k], l, counts[k] + " Drinks")).join("")}
      <p class="muted" id="fcount"></p>`);
    const upd = () => { $("#fcount").textContent = `Im Rad: ${enabled().length} Drinks. Einzelne Drinks kannst du unter „Karte“ abwählen.`; };
    upd();
    $("#f-incl").onchange = e => { S.inclOnly = e.target.checked; save(); upd(); };
    $("#f-af").onchange = e => { S.allowAf = e.target.checked; save(); upd(); };
    Object.keys(CATS).forEach(k => { $("#c-" + k).onchange = e => { S.cats[k] = e.target.checked; save(); upd(); }; });
  }
  if (which === "mine") {
    if (!S.players.length) { sheet("Meine Drinks", `<p class="muted">Erst Spieler eintragen.</p>`); return; }
    if (S.myP == null || !S.players[S.myP]) S.myP = S.cur || 0;
    const p = S.players[S.myP];
    const sort = S.mySort || "new";
    let hs = S.history.filter(h => h.pid === p.id && BY_ID[h.id]);
    const rated = hs.filter(h => h.r);
    const avg = rated.length ? (rated.reduce((a, h) => a + h.r, 0) / rated.length).toLocaleString("de-DE", { maximumFractionDigits: 1 }) : "–";
    if (sort === "best") hs = hs.slice().sort((a, b) => (b.r || 0) - (a.r || 0) || b.t - a.t);
    if (sort === "open") hs = hs.filter(h => !h.r);
    const tabs = `<div class="players" style="margin-bottom:6px">${S.players.map((q, i) => `<button class="chip ${i === S.myP ? "on" : ""}" type="button" data-mp="${i}">${esc(q.name)}</button>`).join("")}</div>`;
    const sorts = `<div class="mode" id="mySort" style="margin:10px 0 2px;grid-template-columns:1fr 1fr 1fr">${[["new", "Neueste"], ["best", "Beste"], ["open", "Unbewertet"]].map(([k, l]) => `<button type="button" data-ms="${k}" class="${sort === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
    const items = hs.map(h => {
      const d = BY_ID[h.id];
      const t = new Date(h.t).toLocaleString("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit" });
      return `<div class="row" style="flex-wrap:wrap"><div class="grow"><b>${esc(d.name)}</b>${tags(d)}<div class="muted">${esc(CATS[d.cat] || "")} · ${h.m ? "abgehakt " : ""}${t}</div></div>${starsHTML(h)}</div>`;
    }).join("");
    sheet("Meine Drinks", `${tabs}
      <div class="mysum"><div><b>${S.history.filter(h => h.pid === p.id && BY_ID[h.id]).length}</b><span>getrunken</span></div><div><b>${avg}</b><span>Ø Sterne</span></div><div><b>${S.history.filter(h => h.pid === p.id && BY_ID[h.id] && !h.r).length}</b><span>unbewertet</span></div></div>
      ${sorts}
      <p class="muted">Sterne antippen zum Bewerten oder Ändern, nochmal denselben Stern antippen löscht die Bewertung.${SY.code ? " Wird mit allen im Raum geteilt." : ""}</p>
      ${items || `<p class="muted">${sort === "open" ? "Alles bewertet. 🎉" : "Noch nichts gedreht."}</p>`}`);
    overlay.querySelectorAll("[data-mp]").forEach(b => b.onclick = () => { S.myP = +b.dataset.mp; openSheet("mine"); });
    overlay.querySelectorAll("[data-ms]").forEach(b => b.onclick = () => { S.mySort = b.dataset.ms; openSheet("mine"); });
  }
  if (which === "history") {
    const pmap = Object.fromEntries(S.players.map(p => [p.id, p.name]));
    const items = S.history.slice(0, 200).map(h => {
      const d = BY_ID[h.id]; if (!d) return "";
      const t = new Date(h.t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      return `<div class="row" style="flex-wrap:wrap"><div class="grow"><b>${esc(pmap[h.pid] || "Entfernt")}</b> · ${esc(d.name)}${tags(d)} <span class="muted" style="font-variant-numeric:tabular-nums">${t}</span></div>${starsHTML(h)}</div>`;
    }).join("");
    const per = S.players.map(p => `<div class="row"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${p.seen.map(id => BY_ID[id] ? esc(BY_ID[id].name) : "").filter(Boolean).join(", ") || "noch nichts"}</div></div><span class="muted">${p.seen.length}</span></div>`).join("");
    sheet("Verlauf", `${S.history.length ? `<button class="btn small" type="button" id="undo">Letzten Dreh rückgängig</button>` : ""} ${S.history.some(h => h.rid) ? `<button class="btn small pri" type="button" id="lastOrder">Letzte Bestellung zeigen</button>` : ""}
      <div class="cathead">Pro Spieler</div>${per || `<p class="muted">Noch keine Spieler.</p>`}
      <div class="cathead">Zuletzt gedreht <span class="muted">(Sterne antippen zum Bewerten)</span></div>${items || `<p class="muted">Noch nichts gedreht.</p>`}`);
    const lr = S.history.find(h => h.rid); const ob = $("#lastOrder"); if (ob && lr) ob.onclick = () => showOrder(lr.rid);
    const u = $("#undo"); if (u) u.onclick = () => { undo(); openSheet("history"); };
  }
  if (which === "stats") {
    const H = S.history.slice().reverse().filter(h => BY_ID[h.id]);
    if (!H.length) { sheet("Statistik", `<p class="muted">Noch nichts gedreht. Nach den ersten Runden steht hier, wer wie viel hatte.</p>`); return; }
    const pmap = Object.fromEntries(S.players.map(p => [p.id, p.name]));
    const fmtT = t => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    const per = {};
    H.forEach(h => { (per[h.pid] = per[h.pid] || []).push(BY_ID[h.id]); });
    const rated = H.filter(h => h.r);
    const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
    const f1 = x => x.toFixed(1).replace(".", ",");
    const ratedBy = pid => rated.filter(h => h.pid === pid).sort((a, b) => b.r - a.r);
    const ranking = Object.entries(per).map(([pid, ds]) => ({ pid, name: pmap[pid] || "Entfernt", ds, cl: ds.reduce((s, d) => s + spiritCl(d), 0) }))
      .sort((a, b) => b.ds.length - a.ds.length || b.cl - a.cl);
    const max = ranking[0].ds.length;
    const top = (arr) => { const c = {}; arr.forEach(x => c[x] = (c[x] || 0) + 1); const e = Object.entries(c).sort((a, b) => b[1] - a[1]); return e.length ? e[0] : null; };
    const span = H[H.length - 1].t - H[0].t;
    const hrs = Math.max(span / 36e5, 0);
    const totalCl = ranking.reduce((s, r) => s + r.cl, 0);
    const kpis = `<div class="kpis"><div class="kpi"><b>${H.length}</b><span>Drinks</span></div><div class="kpi"><b>${hrs >= 1 ? hrs.toFixed(1).replace(".", ",") + " h" : Math.round(span / 6e4) + " min"}</b><span>${fmtT(H[0].t)}–${fmtT(H[H.length - 1].t)}</span></div><div class="kpi"><b>${(totalCl / 100).toFixed(1).replace(".", ",")} l</b><span>Schnaps ca.</span></div></div>`;
    const rank = ranking.map((r, i) => {
      const fav = top(r.ds.map(spiritOf).filter(Boolean));
      const cat = top(r.ds.map(d => CATS[d.cat]));
      return `<div class="row"><span class="medal">${i + 1}.</span><div class="grow"><b>${esc(r.name)}</b> <span class="muted">· ${r.ds.length} Drinks · ca. ${r.cl} cl Schnaps</span>
        <div class="bar"><i style="width:${Math.round(r.ds.length / max * 100)}%"></i></div>
        <div class="muted" style="margin-top:4px">Meistens ${fav ? esc(fav[0]) : "–"} · Lieblingskategorie ${cat ? esc(cat[0]) : "–"}</div>
        ${(() => { const rr = ratedBy(r.pid); if (!rr.length) return `<div class="muted">Noch nichts bewertet</div>`;
          const best = rr[0], worst = rr[rr.length - 1];
          return `<div class="muted">Ø ${f1(avg(rr.map(h => h.r)))} ★ · Top: ${esc(BY_ID[best.id].name)} (${best.r}★)${rr.length > 1 && worst.r < best.r ? ` · Flop: ${esc(BY_ID[worst.id].name)} (${worst.r}★)` : ""}</div>`; })()}</div></div>`;
    }).join("");
    // Zeitverlauf pro Stunde
    const start = new Date(H[0].t); start.setMinutes(0, 0, 0);
    const buckets = [];
    for (let t = start.getTime(); t <= H[H.length - 1].t; t += 36e5) buckets.push({ t, n: 0 });
    H.forEach(h => { const b = buckets[Math.floor((h.t - start.getTime()) / 36e5)]; if (b) b.n++; });
    const bmax = Math.max(...buckets.map(b => b.n));
    const hours = `<div class="hours">${buckets.slice(-24).map(b => `<div><em>${b.n || ""}</em><i style="height:${Math.round(b.n / bmax * 70)}px"></i>${new Date(b.t).getHours()}h</div>`).join("")}</div>`;
    const byDrink = {};
    rated.forEach(h => (byDrink[h.id] = byDrink[h.id] || []).push(h.r));
    const drinkAvg = Object.entries(byDrink).map(([id, rs]) => ({ d: BY_ID[id], a: avg(rs), n: rs.length })).sort((a, b) => b.a - a.a || b.n - a.n);
    const line = x => `<div class="row"><div class="grow"><b>${esc(x.d.name)}</b> <span class="muted">${x.n}× bewertet</span></div><b style="color:var(--gold);font-variant-numeric:tabular-nums">${f1(x.a)} ★</b></div>`;
    const tops = drinkAvg.slice(0, 3), flops = drinkAvg.length > 3 ? drinkAvg.slice(-3).reverse().filter(x => !tops.includes(x)) : [];
    const topflop = rated.length
      ? `<div class="cathead">Top-Drinks <span class="muted">(Ø ${f1(avg(rated.map(h => h.r)))} ★ aus ${rated.length} Bewertungen)</span></div>${tops.map(line).join("")}${flops.length ? `<div class="cathead">Flop-Drinks</div>${flops.map(line).join("")}` : ""}`
      : `<div class="cathead">Top & Flop</div><p class="muted">Noch keine Bewertungen. Bewertet wird auf dem Startbildschirm vor dem nächsten Dreh oder im Verlauf.</p>`;
    const spirits = top(H.map(h => spiritOf(BY_ID[h.id])).filter(Boolean));
    const longest = H.map(h => BY_ID[h.id]).sort((a, b) => b.ing.split(",").length - a.ing.split(",").length)[0];
    const paid = H.filter(h => BY_ID[h.id].price);
    const sum = paid.reduce((s, h) => s + parseFloat(BY_ID[h.id].price.replace(",", ".")), 0);
    const facts = `<div class="row"><div class="grow">Beliebteste Spirituose: <b>${spirits ? esc(spirits[0]) + " (" + spirits[1] + "×)" : "–"}</b></div></div>
      <div class="row"><div class="grow">Aufwendigster Drink: <b>${esc(longest.name)}</b> <span class="muted">(${longest.ing.split(",").length} Zutaten)</span></div></div>
      ${paid.length ? `<div class="row"><div class="grow">Mit Aufpreis: <b>${paid.length} Drinks, ${sum.toFixed(2).replace(".", ",")} €</b></div></div>` : ""}`;
    const text = `Drink-Rad Mein Schiff Flow – ${new Date(H[0].t).toLocaleDateString("de-DE")}\n${H.length} Drinks, ${fmtT(H[0].t)}–${fmtT(H[H.length - 1].t)}\n\n` +
      ranking.map((r, i) => `${i + 1}. ${r.name}: ${r.ds.length} Drinks (ca. ${r.cl} cl Schnaps)\n   ${H.filter(h => h.pid === r.pid).map(h => BY_ID[h.id].name + (h.r ? " " + h.r + "★" : "")).join(", ")}`).join("\n") +
      (tops.length ? `\n\nTop: ${tops.map(x => x.d.name + " " + f1(x.a) + "★").join(", ")}` : "") +
      (flops.length ? `\nFlop: ${flops.map(x => x.d.name + " " + f1(x.a) + "★").join(", ")}` : "");
    sheet("Statistik", `${kpis}<div class="cathead">Rangliste</div>${rank}${topflop}<div class="cathead">Drinks pro Stunde</div>${hours}<div class="cathead">Fun Facts</div>${facts}
      <div class="row"><button class="btn pri" type="button" id="copyStats">Als Text kopieren</button><span class="muted">für die WhatsApp-Gruppe</span></div>
      <textarea id="statsText" readonly hidden style="width:100%;height:160px;background:var(--night);color:var(--foam);border-radius:12px;border:1.5px solid var(--line);padding:10px;font:inherit">${esc(text)}</textarea>
      <p class="muted">Schnaps-Menge ist eine grobe Schätzung: 4 cl pro Cocktail mit Spirituose, 2 cl bei Likör oder Bitter, Sekt und Wein nicht mitgezählt.</p>`);
    $("#copyStats").onclick = async () => {
      try { await navigator.clipboard.writeText(text); toast("Statistik kopiert."); }
      catch (e) { const ta = $("#statsText"); ta.hidden = false; ta.focus(); ta.select(); toast("Text markiert, jetzt kopieren."); }
    };
  }
  if (which === "check") {
    if (!S.players.length) { sheet("Abhaken", `<p class="muted">Erst Spieler eintragen.</p>`); return; }
    if (S.checkP == null || !S.players[S.checkP]) S.checkP = S.cur || 0;
    const p = S.players[S.checkP];
    const en = enabled();
    const done = en.filter(d => p.seen.includes(d.id)).length;
    const tabs = `<div class="players" style="margin-bottom:6px">${S.players.map((q, i) => `<button class="chip ${i === S.checkP ? "on" : ""}" type="button" data-cp="${i}">${esc(q.name)}</button>`).join("")}</div>`;
    const groups = Object.entries(CATS).map(([k, l]) => {
      const ds = en.filter(d => d.cat === k); if (!ds.length) return "";
      const n = ds.filter(d => p.seen.includes(d.id)).length;
      return `<div class="cathead">${esc(l)} <span class="muted">${n}/${ds.length}</span></div>` + ds.map(d => {
        const on = p.seen.includes(d.id);
        return `<label class="drinkline"><input type="checkbox" data-ck="${esc(d.id)}" ${on ? "checked" : ""} aria-label="${esc(d.name)} getrunken"><div class="grow"><span class="name">${esc(d.name)}</span>${tags(d)}<div class="muted">${esc(d.ing)}</div></div></label>`;
      }).join("");
    }).join("");
    sheet("Abhaken", `${tabs}<p class="muted"><b style="color:var(--gold);font-size:1.1rem">${done} / ${en.length}</b> Drinks im Rad schon getrunken. Abgehakte Drinks kommen für ${esc(p.name)} nicht mehr aufs Rad. Haken weg = Drink ist wieder drin.</p>${groups}`);
    overlay.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => { S.checkP = +b.dataset.cp; save(); const y = overlay.querySelector(".sheet").scrollTop; openSheet("check"); });
    overlay.querySelectorAll("[data-ck]").forEach(cb => cb.addEventListener("change", () => {
      const id = cb.dataset.ck;
      if (cb.checked) {
        if (!p.seen.includes(id)) p.seen.push(id);
        if (!S.history.some(h => h.pid === p.id && h.id === id)) S.history.unshift({ pid: p.id, id, t: Date.now(), m: 1 }); // zählt in Statistik, bewertbar
      } else {
        p.seen = p.seen.filter(x => x !== id);
        S.history = S.history.filter(h => !(h.pid === p.id && h.id === id && h.m)); // nur manuelle Haken zurücknehmen, gedrehte bleiben
      }
      save();
      const n = en.filter(d => p.seen.includes(d.id)).length;
      overlay.querySelector(".sheet p.muted b").textContent = `${n} / ${en.length}`;
      renderTop();
    }));
  }
  if (which === "menu") {
    const groups = Object.entries(CATS).map(([k, l]) => {
      const ds = DRINKS.filter(d => d.cat === k);
      return `<div class="cathead">${esc(l)}${k === "pur" ? ` <span class="muted">(4 cl, Sherry/Port/Wermut 5 cl)</span>` : ""}</div>` + ds.map(d => {
        const off = S.excluded.includes(d.id);
        return `<label class="drinkline ${off ? "off" : ""}"><input type="checkbox" data-ex="${esc(d.id)}" ${off ? "" : "checked"} aria-label="${esc(d.name)} im Rad"><div class="grow"><span class="name">${esc(d.name)}</span>${tags(d)}<div class="muted">${esc(d.ing)}</div></div></label>`;
      }).join("");
    }).join("");
    sheet("Getränkekarte", `<p class="muted">${DRINKS.length} Drinks von der Bar-Karte. Haken weg = Drink kommt nie ins Rad (z. B. wenn ihn jemand nicht mag oder die Bar ihn nicht hat).</p>${groups}`);
    overlay.querySelectorAll("[data-ex]").forEach(cb => cb.addEventListener("change", () => {
      const id = cb.dataset.ex;
      S.excluded = S.excluded.filter(x => x !== id);
      if (!cb.checked) S.excluded.push(id);
      cb.closest(".drinkline").classList.toggle("off", !cb.checked);
      save();
    }));
  }
}

// ---------- Statistik-Helfer ----------
const SPIRITS = [
  ["Tequila", /tequila/i], ["Cachaça", /cachaça/i], ["Whisky", /whisk|bourbon|jim beam/i], ["Gin", /\bgin\b|sloe gin/i],
  ["Rum", /\brum\b|havana/i], ["Vodka", /vodka/i], ["Calvados", /calvados/i], ["Jägermeister", /jägermeister/i],
];
function spiritOf(d) {
  if (d.af) return null;
  if (d.cat === "pur") return d.ing.split(" ·")[0];
  if (d.cat === "bier") return "Bier";
  if (d.cat === "wein") return "Wein";
  if (d.cat === "schaum") return "Sekt & Champagner";
  for (const [n, re] of SPIRITS) if (re.test(d.ing)) return n;
  if (/likör|bitter|aperol|campari|malibu|baileys|kahlúa|cointreau|cassis|martini|wermut|lillet|pimm|port/i.test(d.ing)) return "Likör & Bitter";
  if (/sekt|wein|champagner|pils/i.test(d.ing)) return "Sekt & Wein";
  return null;
}
function spiritCl(d) {
  if (d.af) return 0;
  if (["bier", "wein", "schaum"].includes(d.cat)) return 0;
  if (d.cat === "pur") return parseInt(d.ing.match(/(\d+) cl/)?.[1] || "4", 10);
  const n = SPIRITS.filter(([, re]) => re.test(d.ing)).length;
  if (n) return Math.min(n * 4, 10);
  return spiritOf(d) === "Likör & Bitter" ? 2 : 0;
}

function showResult(p, d) {
  overlay.innerHTML = `<div class="scrim"><div class="sheet result" role="dialog" aria-label="Ergebnis">
    <div class="who">${esc(p.name)} bekommt</div>
    <div class="drink">${esc(d.name)}</div>
    <div class="ing">${esc(d.ing)}</div>
    <div class="meta"><span class="tag cat">${esc(CATS[d.cat])}</span>${d.price ? `<span class="tag price">${esc(d.price)}</span>` : `<span class="tag done">inklusive</span>`}${d.af ? `<span class="tag af">alkoholfrei</span>` : ""}</div>
    <div class="actions">
      <button class="btn warn" type="button" id="rUndo">Nochmal drehen</button>
      <button class="btn pri" type="button" id="rNext">Prost!</button>
    </div>
  </div></div>`;
  $("#rNext").onclick = () => closeSheet();
  $("#rUndo").onclick = () => { undo(); closeSheet(); };
}

function undo() {
  const h = S.history.shift(); if (!h) return;
  const i = S.players.findIndex(p => p.id === h.pid);
  if (i >= 0) { const p = S.players[i]; const k = p.seen.lastIndexOf(h.id); if (k >= 0) p.seen.splice(k, 1); S.cur = i; }
  save(); toast("Dreh zurückgenommen.");
}

let toastT;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800);
}

// ---------- Konfetti ----------
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"); c.hidden = false;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const parts = Array.from({ length: 90 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.4, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 4,
    r: Math.random() * 6 + 4, c: COLORS[Math.floor(Math.random() * COLORS.length)], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4,
  }));
  const t0 = performance.now();
  (function f(now) {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += p.va;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
    if (now - t0 < 1800) requestAnimationFrame(f); else { g.clearRect(0, 0, innerWidth, innerHeight); c.hidden = true; }
  })(t0);
}

// ---------- Gemeinsamer Spielstand (Raum) ----------
// Jedes Handy spielt lokal weiter, auch offline. Sobald Netz da ist, wird per 3-Wege-Abgleich
// (letzter gemeinsamer Stand + eigener Stand + Stand im Raum) zusammengeführt: Hinzugefügtes von
// beiden Seiten bleibt, Gelöschtes von einer Seite fliegt raus, bei echten Konflikten gewinnt die eigene Änderung.
const DB_URL = "https://drinkrad-default-rtdb.europe-west1.firebasedatabase.app"; // Firebase Realtime Database URL, z. B. https://xyz-default-rtdb.europe-west1.firebasedatabase.app
const RKEY = KEY + "-room";
const SY = (() => { try { return JSON.parse(localStorage.getItem(RKEY)) || {}; } catch (e) { return {}; } })();
// SY: { code, db, base, rev, last }
const saveSY = () => { try { localStorage.setItem(RKEY, JSON.stringify(SY)); } catch (e) {} };
const dbUrl = () => (SY.db || DB_URL || "").replace(/\/+$/, "");
const fk = s => encodeURIComponent(s).replace(/\./g, "%2E");
const unfk = s => decodeURIComponent(s);

function toShared(st) {
  const o = { players: {}, seen: {}, hist: {}, rate: {}, set: { inclOnly: !!st.inclOnly, allowAf: !!st.allowAf, cats: {} }, excl: {} };
  st.players.forEach((p, i) => {
    o.players[p.id] = { name: p.name, o: i };
    const s = {}; p.seen.forEach(id => s[fk(id)] = true); o.seen[p.id] = s;
  });
  st.history.forEach(h => {
    const k = h.pid + "_" + h.t;
    o.hist[k] = Object.assign({ pid: h.pid, id: h.id, t: h.t }, h.rid ? { rid: h.rid } : {}, h.m ? { m: 1 } : {});
    if (h.r) o.rate[k] = h.r;
  });
  for (const [k, v] of Object.entries(st.cats)) o.set.cats[k] = !!v;
  st.excluded.forEach(id => o.excl[fk(id)] = true);
  return o;
}
function fromShared(o, st) {
  o = o || {};
  const pl = Object.entries(o.players || {}).sort((a, b) => (a[1].o ?? 0) - (b[1].o ?? 0) || a[0].localeCompare(b[0]));
  const curId = st.players[st.cur] && st.players[st.cur].id;
  st.players = pl.map(([id, p]) => ({ id, name: p.name || "?", seen: Object.keys((o.seen || {})[id] || {}).map(unfk) }));
  st.cur = Math.max(0, st.players.findIndex(p => p.id === curId));
  const rate = o.rate || {};
  st.history = Object.entries(o.hist || {}).map(([k, h]) => Object.assign({ pid: h.pid, id: h.id, t: h.t }, h.rid ? { rid: h.rid } : {}, h.m ? { m: 1 } : {}, rate[k] ? { r: rate[k] } : {}))
    .sort((a, b) => b.t - a.t);
  const set = o.set || {};
  if ("inclOnly" in set) st.inclOnly = !!set.inclOnly;
  if ("allowAf" in set) st.allowAf = !!set.allowAf;
  for (const [k, v] of Object.entries(set.cats || {})) if (k in st.cats) st.cats[k] = !!v;
  st.excluded = Object.keys(o.excl || {}).map(unfk);
}
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
const same = (a, b) => stable(a) === stable(b);
function stable(v) {
  if (!isObj(v)) return JSON.stringify(v === undefined ? null : v);
  const ks = Object.keys(v).filter(k => !(isObj(v[k]) && !Object.keys(prune(v[k]) || {}).length)).sort();
  return "{" + ks.map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";
}
function prune(v) { // leere Objekte weg, wie Firebase es auch macht
  if (!isObj(v)) return v;
  const o = {}; for (const [k, x] of Object.entries(v)) { const y = prune(x); if (y !== undefined && !(isObj(y) && !Object.keys(y).length)) o[k] = y; }
  return Object.keys(o).length ? o : undefined;
}
function merge3(b, l, r) {
  b = isObj(b) ? b : undefined;
  const keys = new Set([...Object.keys(b || {}), ...Object.keys(l || {}), ...Object.keys(r || {})]);
  const out = {};
  for (const k of keys) {
    const B = b ? b[k] : undefined, L = l ? l[k] : undefined, R = r ? r[k] : undefined;
    const inB = B !== undefined, inL = L !== undefined, inR = R !== undefined;
    let v;
    if (inL && inR) v = (isObj(L) && isObj(R)) ? merge3(B, L, R) : (same(L, B) ? R : L);
    else if (inL) v = inB ? (same(L, B) ? undefined : L) : L;        // drüben gelöscht, hier unverändert -> weg
    else if (inR) v = inB ? (same(R, B) ? undefined : R) : R;
    if (v !== undefined) out[k] = v;
  }
  return out;
}

let useEtag = true, syncBusy = false, syncAgain = false, syncTimer = 0, pollTimer = 0, syncState = "off"; // off | ok | wait | offline | error
async function fb(path, opt = {}) {
  const res = await fetch(dbUrl() + "/rooms/" + encodeURIComponent(SY.code) + path + ".json", Object.assign({ cache: "no-store" }, opt));
  return res;
}
function setSyncState(s) { syncState = s; renderRoomPill(); }
function syncSoon(ms = 900) {
  if (!SY.code || !dbUrl()) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms);
}
async function syncNow() {
  if (!SY.code || !dbUrl()) return;
  if (syncBusy || spinning) { syncAgain = true; if (spinning) syncSoon(1500); return; }
  if (navigator.onLine === false) { setSyncState("offline"); return; }
  syncBusy = true; setSyncState("wait");
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      let g;
      if (useEtag) { try { g = await fb("/data", { headers: { "X-Firebase-ETag": "true" } }); } catch (e) { useEtag = false; } }
      if (!g) g = await fb("/data");
      if (!g.ok) throw new Error("get " + g.status);
      const etag = useEtag && attempt < 3 ? g.headers.get("ETag") : null; // ohne ETag: einfach überschreiben (Abgleich ist trotzdem passiert)
      const remote = (await g.json()) || {};
      const local = toShared(S);
      const merged = prune(merge3(SY.base, local, remote)) || {};
      if (!same(merged, remote)) {
        const p = await fb("/data", { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, etag ? { "if-match": etag } : {}), body: JSON.stringify(merged) });
        if (p.status === 412) continue; // jemand war schneller -> nochmal holen und zusammenführen
        if (!p.ok) throw new Error("put " + p.status);
        SY.rev = Date.now() + "-" + Math.random().toString(36).slice(2, 6);
        await fb("/rev", { method: "PUT", body: JSON.stringify(SY.rev) });
      }
      SY.base = merged; SY.last = Date.now(); saveSY();
      if (!same(merged, local)) applyRemote(merged);
      setSyncState("ok");
      break;
    }
  } catch (e) {
    setSyncState(navigator.onLine === false ? "offline" : "error");
  } finally {
    syncBusy = false;
    if (syncAgain) { syncAgain = false; syncSoon(300); }
  }
}
// Abgehakte Drinks ohne Eintrag bekommen einen (manuell), doppelte manuelle Einträge werden zusammengelegt.
function fixManual() {
  let changed = false;
  const keep = new Map();
  for (const h of S.history.slice().sort((a, b) => a.t - b.t || (a.m ? 1 : 0) - (b.m ? 1 : 0))) {
    const k = h.pid + "|" + h.id;
    if (h.m && keep.has(k)) { const o = keep.get(k); if (!o.r && h.r) o.r = h.r; h._drop = 1; changed = true; }
    else if (!keep.has(k)) keep.set(k, h);
  }
  if (changed) S.history = S.history.filter(h => !h._drop);
  const now = Date.now();
  S.players.forEach((p, i) => p.seen.forEach((id, j) => {
    if (BY_ID[id] && !S.history.some(h => h.pid === p.id && h.id === id)) { S.history.push({ pid: p.id, id, t: now - 1000 * (p.seen.length - j), m: 1 }); changed = true; }
  }));
  if (changed) S.history.sort((a, b) => b.t - a.t);
  return changed;
}
function applyRemote(o) {
  fromShared(o, S);
  if (fixManual()) syncSoon();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!overlay.innerHTML) render(); else renderTop();
}
async function pollRev() {
  clearTimeout(pollTimer);
  if (!SY.code || !dbUrl()) return;
  if (document.visibilityState === "visible" && navigator.onLine !== false && !syncBusy) {
    try {
      const r = await fb("/rev");
      if (r.ok) { const rev = await r.json(); if (rev && rev !== SY.rev) { SY.rev = rev; await syncNow(); } else if (syncState !== "wait") setSyncState("ok"); }
      else setSyncState("error");
    } catch (e) { setSyncState(navigator.onLine === false ? "offline" : "error"); }
  }
  pollTimer = setTimeout(pollRev, 5000);
}
addEventListener("online", () => syncSoon(200));
addEventListener("offline", () => setSyncState("offline"));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { syncSoon(200); pollRev(); } });

function newCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "";
  for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)];
  return s;
}
const cleanCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
async function createRoom() {
  SY.code = newCode(); SY.base = {}; SY.rev = ""; saveSY();
  await syncNow();
}
async function joinRoom(code) {
  code = cleanCode(code); if (code.length < 4) { toast("Code zu kurz."); return false; }
  const prev = SY.code; SY.code = code;
  try {
    const g = await fb("/data");
    if (!g.ok) throw new Error();
    const remote = await g.json();
    if (!remote) { SY.code = prev; toast("Raum " + code + " gibt es nicht."); return false; }
    SY.base = remote; SY.rev = ""; saveSY();
    applyRemote(remote); setSyncState("ok"); pollRev();
    return true;
  } catch (e) { SY.code = prev; toast("Kein Netz – Beitreten geht nur online."); return false; }
}
function leaveRoom() { SY.code = ""; SY.base = null; SY.rev = ""; saveSY(); setSyncState("off"); }
function roomLink() { return location.href.split(/[?#]/)[0] + "?raum=" + SY.code + (DB_URL ? "" : "&db=" + encodeURIComponent(dbUrl())); }
const okDb = v => /^https:\/\/[^/]+\.(firebasedatabase\.app|firebaseio\.com)\/?$/.test(v);

function renderRoomPill() {
  const b = document.getElementById("roomBtn"); if (!b) return;
  if (!SY.code) { b.className = "roompill"; b.innerHTML = "Gemeinsam spielen"; return; }
  const lbl = { ok: "verbunden", wait: "gleicht ab …", offline: "offline", error: "keine Verbindung", off: "" }[syncState] || "";
  b.className = "roompill on " + syncState;
  b.innerHTML = `<i></i>${esc(SY.code)} <small>${lbl}</small>`;
  const s = document.getElementById("roomState"); if (s) s.textContent = roomStateText();
}
function roomStateText() {
  const t = SY.last ? new Date(SY.last).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "noch nie";
  return { ok: "Verbunden. Zuletzt abgeglichen: " + t, wait: "Gleicht gerade ab …", offline: "Offline. Ihr könnt einfach weiterspielen, es wird abgeglichen, sobald wieder Netz da ist. Zuletzt: " + t, error: "Raum gerade nicht erreichbar. Weiterspielen geht, es wird später abgeglichen. Zuletzt: " + t }[syncState] || "";
}
function openRoomSheet() {
  if (spinning) return;
  if (!dbUrl()) {
    sheet("Gemeinsam spielen", `<p class="muted">Der Raum-Speicher ist noch nicht eingerichtet. Füge hier die Firebase-Datenbank-URL ein (beginnt mit https:// und endet auf firebasedatabase.app oder firebaseio.com).</p>
      <form class="row" id="dbForm"><div class="grow"><input type="text" id="dbIn" placeholder="https://…firebasedatabase.app" autocomplete="off" autocapitalize="off" spellcheck="false"></div><button class="btn pri" type="submit">OK</button></form>`);
    $("#dbForm").onsubmit = e => { e.preventDefault(); const v = $("#dbIn").value.trim(); if (!okDb(v)) { toast("Das sieht nicht nach einer Firebase-URL aus."); return; } SY.db = v; saveSY(); openRoomSheet(); };
    return;
  }
  if (SY.code) {
    sheet("Gemeinsam spielen", `<div class="roomcode">${esc(SY.code)}</div>
      <p class="muted" style="text-align:center">Diesen Code den anderen sagen. Sie tippen oben auf „Gemeinsam spielen“ und geben ihn ein.</p>
      <div class="row" style="justify-content:center;gap:8px"><button class="btn pri" type="button" id="shareRoom">Link teilen</button><button class="btn" type="button" id="syncRoom">Jetzt abgleichen</button></div>
      <p class="muted" id="roomState">${esc(roomStateText())}</p>
      <p class="muted">Alle Handys im Raum teilen Spieler, Verlauf, Bewertungen, Abhaken-Listen und Filter. Wer gerade dreht, wählt jedes Handy selbst.</p>
      <div class="row"><div class="grow"><b>Raum verlassen</b><div class="muted">Dein Stand bleibt auf diesem Handy, wird aber nicht mehr geteilt.</div></div><button class="btn small warn" type="button" id="leaveRoom">Verlassen</button></div>`);
    $("#shareRoom").onclick = async () => {
      const url = roomLink();
      try { if (navigator.share) { await navigator.share({ title: "Drink-Rad", text: "Komm in unseren Drink-Rad-Raum " + SY.code + ":", url }); return; } } catch (e) { return; }
      try { await navigator.clipboard.writeText(url); toast("Link kopiert."); } catch (e) { toast(url); }
    };
    $("#syncRoom").onclick = () => syncNow();
    $("#leaveRoom").onclick = () => { leaveRoom(); toast("Raum verlassen."); closeSheet(); };
    return;
  }
  sheet("Gemeinsam spielen", `<p class="muted">Alle vier Handys teilen einen Spielstand. Spielen geht auch ohne Netz, abgeglichen wird, sobald ein Handy wieder online ist.</p>
    <div class="cathead">Neuen Raum aufmachen</div>
    <p class="muted">Dein jetziger Stand (Spieler, Verlauf, Bewertungen) wird zum gemeinsamen Stand.</p>
    <button class="btn pri" type="button" id="mkRoom">Raum erstellen</button>
    <div class="cathead">Einem Raum beitreten</div>
    <p class="muted">Der Stand auf diesem Handy wird durch den Stand im Raum ersetzt. Tipp: Erst die App zum Home-Bildschirm hinzufügen und dort beitreten, Safari und Home-Bildschirm merken sich getrennt.</p>
    <form class="row" id="joinForm"><div class="grow"><input type="text" id="codeIn" placeholder="Code, z. B. FLOW42" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12"></div><button class="btn pri" type="submit">Beitreten</button></form>`);
  $("#mkRoom").onclick = async () => {
    if (navigator.onLine === false) { toast("Zum Erstellen braucht es einmal Netz."); return; }
    await createRoom();
    if (syncState === "ok") { toast("Raum " + SY.code + " erstellt."); pollRev(); openRoomSheet(); }
    else { leaveRoom(); toast("Hat nicht geklappt. Netz da?"); }
  };
  $("#joinForm").onsubmit = async e => { e.preventDefault(); if (await joinRoom($("#codeIn").value)) { toast("Willkommen im Raum " + SY.code + "!"); openRoomSheet(); } };
}
document.getElementById("roomBtn").addEventListener("click", openRoomSheet);
(async () => {
  const qs = new URLSearchParams(location.search), q = qs.get("raum"), qdb = qs.get("db");
  if (qdb && okDb(qdb) && !DB_URL) { SY.db = qdb; saveSY(); }
  if (q) {
    history.replaceState(null, "", location.pathname);
    const code = cleanCode(q);
    if (code && code !== SY.code && dbUrl()) {
      if (await joinRoom(code)) toast("Willkommen im Raum " + SY.code + "!");
    }
  }
  renderRoomPill();
  if (SY.code) { syncSoon(300); pollRev(); }
})();

// ---------- Start ----------
document.getElementById("ver").textContent = "Version " + APP_VERSION + " · Stand 22.11.2026";
if (fixManual()) save();
render();
sizeCanvas();
addEventListener("resize", sizeCanvas);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
